# G20 变异门禁（发布前）——三口径（2026-11-16 重定义，依据报告 §九 节奏算术）
#
# 用途：对核心包（sz-orm-core / sz-orm-sqlx）执行 cargo-mutants 变异测试，杀率 < fail-under 即红牌。
#
# 三口径（workflow_dispatch inputs.mode）：
#   A. diff（默认，主门禁）    ：--diff-ref <base> 对发布 diff 改动行全量变异——分钟级，每次发布必跑
#   B. modules（纵深）        ：--modules <m1,m2> 模块滚动全量——数小时/批，滚动覆盖 core 大模块
#   C. full（全包全量）        ：仅 sqlx 可行（887 变异体 94min 实测 43.9%）；
#                               core 11725 变异体 ×10min/个 ≈ 12 天+（j2）——**禁用于 core**。
#                               另：cargo-mutants 27.1.0 Windows tmp 竞态 bug（j>2 必死），
#                               self-hosted Windows runner 须 jobs=2，详见
#                               docs/assessment/2026-10-29-production-readiness-report.md §九。
#
# 运行方式：self-hosted runner（szorm-g20-win，Windows）。GitHub 托管 runner（360min 上限）无法承载 C。
# 触发：workflow_dispatch 手动。矩阵双 job 共享 workdir——checkout 会清扫前 job 结果，
#       结果目录已按 mode 前缀改名 + `if: always()` artifact 上传兜底。

name: Mutation Full (G20 release gate)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '口径：full=全包全量（仅 sqlx 可行）/ modules=模块滚动全量 / diff=发布 diff 变异（主门禁）'
        default: 'diff'
        required: false
      packages:
        description: '变异目标包（逗号分隔）'
        default: 'sz-orm-core,sz-orm-sqlx'
        required: false
      modules:
        description: 'mode=modules 时：模块名（逗号分隔，如 dialect,query,pool）'
        default: 'dialect,query,pool'
        required: false
      diff_ref:
        description: 'mode=diff 时：diff 基线（git ref，如上个发布 tag）'
        default: 'HEAD~1'
        required: false
      fail_under:
        description: '杀率门槛（%）'
        default: '70'
        required: false
      jobs:
        description: 'cargo-mutants 并行度（Windows runner 须 ≤2 规避 tmp 竞态 bug，见报告 §九）'
        default: '2'
        required: false

jobs:
  mutation:
    name: Full mutation (${{ matrix.package }})
    runs-on: self-hosted
    timeout-minutes: 4320 # self-hosted 可设 3 天；GitHub 托管 runner 上限 360 请勿照搬
    strategy:
      fail-fast: false
      matrix:
        package: [sz-orm-core, sz-orm-sqlx]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.99 toolchain
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Configure crates.io mirror (TUNA, runner 侧网络加速)
        shell: bash
        run: |
          mkdir -p "${CARGO_HOME:-$HOME/.cargo}"
          if [ ! -f "${CARGO_HOME:-$HOME/.cargo}/config.toml" ]; then
            printf '[source.crates-io]\nreplace-with = "tuna"\n\n[source.tuna]\nregistry = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"\n' \
              > "${CARGO_HOME:-$HOME/.cargo}/config.toml"
          fi

      - name: Install cargo-mutants
        shell: bash
        run: cargo install cargo-mutants --locked

      - name: Run mutation (${{ matrix.package }}, mode=${{ github.event.inputs.mode || 'diff' }})
        shell: bash
        run: |
          MODE="${{ github.event.inputs.mode || 'diff' }}"
          ARGS=(--packages "${{ matrix.package }}")
          case "$MODE" in
            modules) ARGS+=(--modules "${{ github.event.inputs.modules || 'dialect,query,pool' }}") ;;
            diff)    ARGS+=(--diff-ref "${{ github.event.inputs.diff_ref || 'HEAD~1' }}") ;;
            full)    : ;; # 全包全量（仅 sqlx 可行，core 见报告 §九节奏算术）
          esac
          bash scripts/collect-mutation-linux.sh \
            "${ARGS[@]}" \
            --fail-under "${{ github.event.inputs.fail_under || '70' }}" \
            --jobs "${{ github.event.inputs.jobs || '2' }}" \
            --json "mutation-result-${{ matrix.package }}.json"

      - name: Rename output dir by mode (avoid matrix checkout wiping sibling job results)
        if: always()
        shell: bash
        run: |
          # 矩阵双 job 共享 workdir：后跑的 job checkout 会清扫前 job 的 mutants-out-*。
          # 将结果目录改名为带模式前缀，并在 Upload 步骤按名收取（[ -d ] 守卫已保证只处理现存目录）。
          for d in mutants-out-*; do
            [ -d "$d" ] || continue
            mv "$d" "${{ github.event.inputs.mode || 'diff' }}-$d"
          done

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ matrix.package }}
          path: |
            mutation-result-${{ matrix.package }}.json
            *mutants-out-*/

  # 汇总：双包杀率均达门槛才算通过（脚本各自 exit 0/1，fail-fast: false 保证都跑完）
  gate:
    name: G20 Gate (all packages >= fail-under)
    needs: mutation
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          if [ "${{ needs.mutation.result }}" != "success" ]; then
            echo "❌ G20 全量变异门禁未通过（某包杀率 < 门槛或执行失败）"
            exit 1
          fi
          echo "✅ G20 全量变异门禁通过"
