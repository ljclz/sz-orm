# =============================================================================
# 真实服务集成测试工作流
# 触发: 手动触发、每日定时 (02:00 UTC+8)
# 内容: 通过 services 启动全部依赖服务（MySQL 9.7 / PostgreSQL 18 /
#       RabbitMQ 3.13 / Mosquitto 2.0 / MinIO），运行工作空间中所有
#       #[ignore] 标注的真实 DB / 云服务集成测试
# =============================================================================
name: Integration

on:
  workflow_dispatch:
  schedule:
    # 每日 02:00 (Asia/Shanghai, UTC+8) 运行完整真实服务集成测试
    - cron: "0 18 * * *"
  pull_request:
    types: [labeled, synchronize]
    # 当 PR 添加 "run-integration" 标签时触发真实 DB 集成测试
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  integration:
    name: Real Service Integration Tests
    runs-on: ubuntu-latest
    # PR 触发时仅在添加 "run-integration" 标签时运行；定时/手动触发始终运行
    if: |
      github.event_name != 'pull_request' ||
      contains(github.event.pull_request.labels.*.name, 'run-integration')
    services:
      mysql:
        image: mysql:9.7
        env:
          MYSQL_ROOT_PASSWORD: szormtestpwd
          MYSQL_DATABASE: sz_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pszormtestpwd"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: szormtestpwd
          POSTGRES_DB: sz_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # SzRSQL（自研 pgwire v3.0 数据库，v1.0.0-rc.2+；上游 9 项 UP-x + DISCARD 修复均已合入）。
      # 镜像由前置 build-szrsql 步骤在 checkout 的 szrsql 仓库用自带 Dockerfile 构建为 szrsql:ci。
      # --port 6543 避开 PG 5432；--auth-mode trust 仅本地测试；--connection-idle-timeout 0 防长测切断。
      # 测试经 SZ_ORM_SZRSQL_URL（postgres://…6543/postgres）注入；未启动则集成测试自动跳过（可信度由 build 步骤把关）
      szrsql:
        image: szrsql:ci
        ports:
          - 6543:6543
        options: >-
          --entrypoint szrsql
          --host 0.0.0.0 --port 6543 --auth-mode trust --connection-idle-timeout=0
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      mosquitto:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
      minio:
        image: minio/minio:RELEASE.2024-10-13T13-34-11Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SZ_ORM_MYSQL_URL: mysql://root:szormtestpwd@127.0.0.1:3306/sz_orm_test
      SZ_ORM_PG_URL: postgres://postgres:szormtestpwd@127.0.0.1:5432/sz_orm_test
      # szrsql 集成套件（integration_szrsql / _matrix / _kill_recover / _sq_differential smoke）
      SZ_ORM_SZRSQL_URL: postgres://postgres:trust@127.0.0.1:6543/postgres
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: test-bucket
      S3_TEST_REGION: us-east-1
      S3_TEST_ACCESS_KEY: minioadmin
      S3_TEST_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-all-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-all-

      # 构建 SzRSQL 镜像（ci service 引用）。szrsql 是自研仓库（独立 git 仓库，主分支为 master；
      # ADR-0001 只读遵守——构建需在 szrsql 仓库根执行；此 job 只 checkout 到工作目录子路径，不修改文件）。
      # 失败即阻断后续 szrsql 集成测试（可信度把关）。
      - name: Checkout SzRSQL repo
        uses: actions/checkout@v4
        with:
          repository: ljclz/szrsql
          ref: master
          path: szrsql

      - name: Build SzRSQL Docker image (szrsql:ci)
        run: |
          cd szrsql
          # 用 szrsql 自带 Dockerfile 构建（多阶段 release）。缓存不可重复利用时尝试
          # --push=false；镜像名 szrsql:ci 供上方 services.szrsql 引用。
          docker build -t szrsql:ci .

      - name: Wait for MQTT broker (port 1883)
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then
              echo "MQTT broker is ready"
              exit 0
            fi
            echo "waiting for MQTT broker... ($i)"
            sleep 1
          done
          echo "MQTT broker did not become ready in time"
          exit 1

      - name: Create MinIO test bucket (test-bucket)
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2024-10-13T13-34-11Z -c "
            until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin; do
              echo 'waiting for MinIO...' && sleep 2
            done &&
            mc mb --ignore-existing local/test-bucket
          "

      - name: Run sz-orm-core MySQL integration tests (10 万条 + 8 任务并发)
        run: cargo test --package sz-orm-core --test integration_mysql -- --ignored --nocapture --test-threads=1

      - name: Run sz-orm-core PostgreSQL integration tests (10 万条 + 8 任务并发)
        run: cargo test --package sz-orm-core --test integration_pg -- --ignored --nocapture --test-threads=1

      - name: Run real DB pool/transaction tests (sz-orm-sqlx)
        run: cargo test --package sz-orm-sqlx --test real_db_pool_tests -- --ignored --nocapture --test-threads=1

      - name: Run real DB jepsen-style tests (sz-orm-sqlx)
        run: cargo test --package sz-orm-sqlx --test real_db_jepsen -- --ignored --nocapture --test-threads=1

      - name: Run SzRSQL integration tests (sz-orm-sqlx, pgwire 6543)
        run: |
          SZ_ORM_SZRSQL_URL="$SZ_ORM_SZRSQL_URL" cargo test --package sz-orm-sqlx \
            --test integration_szrsql -- --ignored --nocapture --test-threads=1

      - name: Run SzRSQL matrix integration tests (M1~M9 + M4/M5/M9 revived)
        run: |
          SZ_ORM_SZRSQL_URL="$SZ_ORM_SZRSQL_URL" cargo test --package sz-orm-sqlx \
            --test integration_szrsql_matrix -- --ignored --nocapture --test-threads=1

      - name: Run SzRSQL kill-recover pool tests (故障恢复)
        run: |
          SZ_ORM_SZRSQL_URL="$SZ_ORM_SZRSQL_URL" cargo test --package sz-orm-sqlx \
            --test integration_szrsql_kill_recover -- --ignored --nocapture --test-threads=1

      - name: Run SzRSQL × SQLite tripled smoke (szrsql 非 SQLite 项)
        run: |
          SZ_ORM_SZRSQL_URL="$SZ_ORM_SZRSQL_URL" cargo test --package sz-orm-sqlx \
            --test integration_sq_differential szrsql_matrix_smoke_regression \
            -- --ignored --nocapture --test-threads=1

      # R6：e2e 套件缺库不再静默通过。CI 只准备了 MySQL(test 库)/PG，故用
      # SZ_ORM_E2E_REQUIRED 强制这些 service 真实可用；shop/njszjt/Oracle 等未准备的服务
      # 允许跳过但仍输出 `E2E_SKIP[...]` 记账行。必需 service 出现跳过即失败。
      - name: Run real DB e2e suites in strict skip-accounting mode
        run: |
          set -euo pipefail
          : > e2e-strict.log
          for t in $(cd packages/sz-orm-core/tests && ls e2e_*.rs | sed 's/\.rs$//'); do
            echo "=== $t ==="
            SZ_ORM_E2E_STRICT=1 SZ_ORM_E2E_REQUIRED=mysql,mysql-test,postgres \
            SZ_ORM_E2E_MYSQL_URL_TEST="$SZ_ORM_MYSQL_URL" \
              cargo test --package sz-orm-core --features e2e-real-db --test "$t" \
                -- --nocapture --test-threads=1 2>&1 | tee -a e2e-strict.log
          done
          if grep -E 'E2E_SKIP\[(mysql|mysql-test|postgres)\]' e2e-strict.log; then
            echo "::error::e2e 必需服务被跳过（MySQL test 库 / PostgreSQL），测试可信度不成立"
            exit 1
          fi

      - name: Run real MQTT broker tests (sz-orm-mqtt, real-broker)
        run: cargo test --package sz-orm-mqtt --features real-broker -- --ignored --nocapture

      - name: Run real RabbitMQ tests (sz-orm-queue, rabbitmq)
        run: cargo test --package sz-orm-queue --features rabbitmq -- --ignored --nocapture

      - name: Run real S3/MinIO tests (sz-orm-storage, s3-sdk)
        run: cargo test --package sz-orm-storage --features s3-sdk -- --ignored --nocapture

      - name: Run real WebSocket server tests (sz-orm-websocket, server)
        run: cargo test --package sz-orm-websocket --features server -- --ignored --nocapture
