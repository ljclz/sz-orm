name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # ============================================================================
  # Job 1: 代码格式检查 + clippy 静态分析
  # ============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ============================================================================
  # Job 1.4: 度量真实性扫描（门禁 18，2026-10-27 整改 P0-2 固化进 CI）
  #
  # README 双语的测试数/feature 数/方言数必须与源码统计一致。
  # 背景：21134→21136→21153 三次漂移均因手写数字未随提交重算；
  # 本 job 先以 --fix 自动同步数字，再用 git diff 强制提交修正，阻断漂移 PR。
  # ============================================================================
  metrics-real:
    name: Metrics Real (Gate 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run metrics-real check (auto-fix then verify)
        run: |
          python3 scripts/check-metrics-real.py --fix
          git diff --exit-code

  # ============================================================================
  # Job 1.9: 门禁脚本自测（2026-10-27 SDET 评测 ROI-3 整改）
  #
  # 背景：24 道门禁的"检查器"此前只有 2 个有自测（check-doc-sync /
  # check-sql-injection-auto），且唯一入库的自测未在 CI 运行。
  # 本 job 使门禁脚本自身的回归直接阻断 PR（audit the checkers）。
  # ============================================================================
  checker-self-tests:
    name: Checker Self Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install pytest + PyYAML
        run: pip install pytest pyyaml

      - name: Run checker self-tests (pytest)
        run: python -m pytest tests/test_check_doc_sync.py tests/test_gate_scripts.py tests/test_gate_scripts_ci.py tests/test_check_phantom_tests.py tests/test_check_ci_blocking.py tests/test_check_coverage.py tests/test_audit_verify_ps1.py tests/test_check_csharp_abi_surface.py -v

      - name: Run C# ABI surface gate (P1-5 alignment, no .NET SDK required)
        run: python scripts/check-csharp-abi-surface.py

      - name: Run SQL injection scanner self-test (standalone runner)
        run: python scripts/test_check_sql_injection_auto.py

      - name: Run G25 doc-code-compiles self-test
        run: python scripts/test_check_doc_code_compiles.py

      - name: Run G32 filename-encoding gate on real repo
        run: python3 scripts/check-filename-encoding.py

      - name: Run G33 doc-version-consistency gate on real repo
        run: python3 scripts/check-doc-version-consistency.py

      - name: Run phantom-tests gate on real repo (Gate 30 smoke)
        run: python3 scripts/check-phantom-tests.py

      - name: Run CI-blocking gate on real repo (Gate 31 smoke)
        run: python3 scripts/check-ci-blocking.py

  # ============================================================================
  # Job 1.5: ADR-0001 上游仓库未修改检查
  #
  # 确保核心包（sz-orm-core / sz-orm-auth / sz-orm-config 等）的修改
  # 已正确提交，且文档与代码保持一致。
  # ============================================================================
  check-upstream:
    name: ADR-0001 Check (Upstream Unmodified)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tomli (TOML parser for Python < 3.11)
        run: pip install tomli

      - name: Run ADR-0001 upstream check
        run: bash scripts/check-upstream-unmodified.sh

      - name: Run doc consistency check
        run: python3 scripts/check-doc-consistency.py

      - name: Run G34 generated-code compile gate
        run: python3 scripts/check-generated-code-compiles.py

  # ============================================================================
  # Job 1.6: 文档与代码一致性检查（独立 job，快速失败）
  #
  # 验证 AGENTS.md 和 sz-orm-engineering-practices.md 中的关键数据
  # 与实际 Cargo.toml 一致：包数量、版本号等。
  # ============================================================================
  check-docs:
    name: Doc Consistency Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install tomli (TOML parser for Python < 3.11)
        run: pip install tomli

      - name: Run doc consistency check
        run: python3 scripts/check-doc-consistency.py

      # Gate 24：README Examples 表格 ↔ examples/src/bin 双向一致
      - name: Run G24 examples-list gate
        run: python3 scripts/check-examples-readme.py

      # Gate 25：文档示例代码引用的 API/宏必须真实存在
      - name: Run G25 doc-code-compiles gate
        run: python3 scripts/check-doc-code-compiles.py

  # ============================================================================
  # Job 1.7: 文档同步更新检查（门禁 14）
  #
  # 检查代码变更是否触发对应文档的同步更新。当 Cargo.toml 版本/feature、
  # pub API、pool.rs、dialect.rs、typed_ast.rs、l2_cache.rs、migration 等变更时，
  # 对应文档必须同步更新，否则阻断 PR。
  # 跳过标记：在受影响文档中添加 `# doc-sync-skip` 行可跳过检查。
  # ============================================================================
  check-doc-sync:
    name: Doc Sync Check (Gate 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史以获取 diff

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run doc sync check
        run: python3 scripts/check-doc-sync.py --diff HEAD

  # ============================================================================
  # Job 2: 工作空间编译验证
  # ============================================================================
  build:
    name: Build (${{ matrix.os }}, Rust ${{ matrix.rust }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.rust }}-

      - name: Build workspace
        run: cargo build --workspace --all-targets --verbose
        env:
          CARGO_INCREMENTAL: ${{ matrix.os == 'windows-latest' && '0' || '1' }}

      - name: Build documentation (all platforms, skip --all-features to avoid pulsar/rdkafka native deps)
        run: cargo doc --workspace --no-deps
        env:
          CARGO_INCREMENTAL: ${{ matrix.os == 'windows-latest' && '0' || '1' }}
          RUSTDOCFLAGS: ${{ matrix.os == 'windows-latest' && '-C link-arg=/STACK:8388608' || '' }}

  # ============================================================================
  # Job 2.5: cargo-hack — 每个 feature 独立编译验证
  #
  # 改进2：安装 cargo-hack 并加入 CI
  # 验证每个 feature 在单独启用时能正确编译，避免 feature 间隐藏依赖
  # ============================================================================
  feature-matrix:
    name: Feature Matrix (cargo-hack)
    runs-on: ubuntu-latest
    needs: [lint]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-hack-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-hack-

      - name: Install cargo-hack
        run: cargo install cargo-hack --locked

      - name: Install native deps (protoc + cmake for pulsar/rdkafka features)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - name: Check each feature compiles independently
        run: cargo hack check --workspace --each-feature --no-dev-deps

  # ============================================================================
  # Job 2.6: cargo-udeps — 未使用依赖检测
  #
  # 改进3：安装 cargo-udeps 并加入 CI
  # 检测 Cargo.toml 中声明但代码未使用的依赖，避免依赖膨胀
  # 需要 nightly 工具链
  # ============================================================================
  unused-deps:
    name: Unused Dependencies (cargo-udeps)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-udeps-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-udeps-

      - name: Install cargo-udeps
        run: cargo install cargo-udeps --locked

      - name: Detect unused dependencies
        continue-on-error: true
        run: cargo +nightly udeps --workspace --all-targets || true

  # ============================================================================
  # Job 3: 工作空间单元/集成测试（无外部数据库）
  # ============================================================================
  test:
    name: Test Suite (no external DB)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-

      - name: Run workspace tests (excludes #[ignore] integration tests)
        run: cargo test --workspace --verbose

      - name: Run SQLite integration tests
        run: cargo test --package sz-orm-core --test integration_sqlite --verbose

  # ============================================================================
  # Job 3.5: v0.2.2 修复 P1-5：real-* feature 编译验证
  #
  # 确保 sz-orm-postgis / sz-orm-timeseries / sz-orm-search 三个生态包的
  # real-* feature 在 CI 上能正确编译（防止伪实现/编译错误逃逸到 main）。
  # ============================================================================
  real-features-compile:
    name: Real-* Features Compile Check
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-real-features-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-real-features-

      - name: Check sz-orm-postgis (real-postgis)
        run: cargo check --package sz-orm-postgis --features real-postgis --verbose

      - name: Check sz-orm-timeseries (real-timescale)
        run: cargo check --package sz-orm-timeseries --features real-timescale --verbose

      - name: Check sz-orm-search (real-es)
        run: cargo check --package sz-orm-search --features real-es --verbose

      - name: Check sz-orm-search (real-opensearch)
        run: cargo check --package sz-orm-search --features real-opensearch --verbose

      - name: Check sz-orm-search (real-meilisearch)
        run: cargo check --package sz-orm-search --features real-meilisearch --verbose

      - name: Check sz-orm-search (all real-* features)
        run: cargo check --package sz-orm-search --features "real-es,real-opensearch,real-meilisearch" --verbose

  # ============================================================================
  # Job 4: 真实数据库集成测试（MySQL + PostgreSQL + SQLite）
  # ============================================================================
  integration-test:
    name: Integration Tests (MySQL ${{ matrix.mysql }}, PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: "8.0"
            pg: "14"
          - mysql: "8.4"
            pg: "16"
          - mysql: "9.7"
            pg: "18"
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: <your-password>
          MYSQL_DATABASE: sz_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p<your-password>"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: <your-password>
          POSTGRES_DB: sz_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_URL: mysql://root:<your-password>@127.0.0.1:3306/sz_orm_test
      PG_URL: postgres://postgres:<your-password>@127.0.0.1:5432/sz_orm_test

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-int-${{ matrix.mysql }}-${{ matrix.pg }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-int-

      - name: Run MySQL integration tests (10 万条 + 8 任务并发)
        run: cargo test --package sz-orm-core --test integration_mysql -- --ignored --nocapture --test-threads=1

      - name: Run PostgreSQL integration tests (10 万条 + 8 任务并发)
        run: cargo test --package sz-orm-core --test integration_pg -- --ignored --nocapture --test-threads=1

  # ============================================================================
  # Job 5: 真实服务集成测试（真实 DB + 云服务，全部 #[ignore] 用例）
  # v10.13.0（SDET ROI-5 决策，2026-10-28）：对 main 分支阻断。
  # PR 分支 continue-on-error=true（真实服务偶发不稳定不阻塞开发）；
  # main 分支 continue-on-error=false，集成失败即阻断合入。
  # ============================================================================
  integration:
    name: Real Service Integration (MySQL ${{ matrix.mysql }}, PG ${{ matrix.pg }})
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    strategy:
      fail-fast: false
      matrix:
        mysql: ["8.0", "9.7"]
        pg: ["14", "16", "18"]
    services:
      mysql:
        image: mysql:${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: <your-password>
          MYSQL_DATABASE: sz_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p<your-password>"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_PASSWORD: <your-password>
          POSTGRES_DB: sz_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      mosquitto:
        image: eclipse-mosquitto:2.0
        ports:
          - 1883:1883
      minio:
        image: minio/minio:RELEASE.2024-10-13T13-34-11Z
        env:
          MINIO_ROOT_USER: minioadmin
          MINIO_ROOT_PASSWORD: minioadmin
        ports:
          - 9000:9000
        options: >-
          --health-cmd="curl -f http://localhost:9000/minio/health/live || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_URL: mysql://root:<your-password>@127.0.0.1:3306/sz_orm_test
      PG_URL: postgres://postgres:<your-password>@127.0.0.1:5432/sz_orm_test
      S3_TEST_ENDPOINT: http://127.0.0.1:9000
      S3_TEST_BUCKET: test-bucket
      S3_TEST_REGION: us-east-1
      S3_TEST_ACCESS_KEY: minioadmin
      S3_TEST_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ matrix.mysql }}-${{ matrix.pg }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-

      - name: Wait for MQTT broker (port 1883)
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/1883) 2>/dev/null; then
              echo "MQTT broker is ready"
              exit 0
            fi
            echo "waiting for MQTT broker... ($i)"
            sleep 1
          done
          echo "MQTT broker did not become ready in time"
          exit 1

      - name: Create MinIO test bucket (test-bucket)
        run: |
          docker run --rm --network host --entrypoint /bin/sh minio/mc:RELEASE.2024-10-13T13-34-11Z -c "
            until mc alias set local http://127.0.0.1:9000 minioadmin minioadmin; do
              echo 'waiting for MinIO...' && sleep 2
            done &&
            mc mb --ignore-existing local/test-bucket
          "

      - name: Run real DB pool/transaction tests (sz-orm-sqlx, MySQL + PG)
        run: cargo test --package sz-orm-sqlx --test real_db_pool_tests -- --ignored --nocapture --test-threads=1

      - name: Run real MQTT broker tests (sz-orm-mqtt, real-broker)
        run: cargo test --package sz-orm-mqtt --features real-broker -- --ignored --nocapture

      - name: Run real RabbitMQ tests (sz-orm-queue, rabbitmq)
        run: cargo test --package sz-orm-queue --features rabbitmq -- --ignored --nocapture

      - name: Run real S3/MinIO tests (sz-orm-storage, s3-sdk)
        run: cargo test --package sz-orm-storage --features s3-sdk -- --ignored --nocapture

      - name: Run real WebSocket server tests (sz-orm-websocket, server)
        run: cargo test --package sz-orm-websocket --features server -- --ignored --nocapture

  # ============================================================================
  # Job 5.5: 真实 MQ 集成测试（RabbitMQ + NATS + Kafka + ActiveMQ + Pulsar）
  #
  # 使用 service container 启动 5 种 MQ broker，运行 sz-orm-queue 的真实客户端测试。
  # 覆盖 publish/consume/ack/subscribe 全流程。
  # Pulsar 需 protoc，Kafka 需 cmake（Linux 已预装）。
  # v10.13.0（SDET ROI-5 决策，2026-10-28）：对 main 分支阻断。
  # ============================================================================
  mq-integration:
    name: Real MQ Integration (RabbitMQ + NATS + Kafka + ActiveMQ + Pulsar)
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    services:
      # RabbitMQ: AMQP 0.9.1（lapin 客户端）
      rabbitmq:
        image: rabbitmq:3.13
        ports:
          - 5672:5672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s
      # NATS: 纯 Rust 客户端
      nats:
        image: nats:2.10
        ports:
          - 4222:4222
        options: >-
          --health-cmd="wget -qO- http://localhost:8222/healthz || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # Kafka: rdkafka 客户端（需 cmake，Linux 已预装）
      kafka:
        image: bitnami/kafka:3.7
        ports:
          - 9092:9092
        env:
          KAFKA_CFG_NODE_ID: 1
          KAFKA_CFG_PROCESS_ROLES: controller,broker
          KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
          KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@127.0.0.1:9093
          KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
        options: >-
          --health-cmd="kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list"
          --health-interval=10s
          --health-timeout=10s
          --health-retries=15
          --health-start-period=30s
      # ActiveMQ Artemis: AMQP 1.0（lapin 客户端）
      activemq:
        image: vromero/activemq-artemis:2.33-alpine
        ports:
          - 61616:61616
        env:
          ARTEMIS_USER: artemis
          ARTEMIS_PASSWORD: artemis
        options: >-
          --health-cmd="/opt/activemq-artemis/bin/artemis check queue || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=15
          --health-start-period=60s
      # Pulsar: pulsar crate（需 protoc，Linux 已预装）
      pulsar:
        image: apachepulsar/pulsar:3.2.0
        ports:
          - 6650:6650
        options: >-
          --health-cmd="curl -f http://localhost:8080/admin/v2/clusters/local || exit 1"
          --health-interval=15s
          --health-timeout=10s
          --health-retries=20
          --health-start-period=60s
    env:
      RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672//
      NATS_URL: nats://127.0.0.1:4222
      KAFKA_BROKERS: 127.0.0.1:9092
      ACTIVEMQ_URL: amqp://artemis:artemis@127.0.0.1:61616
      PULSAR_URL: pulsar://127.0.0.1:6650

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc (for pulsar crate)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mq-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mq-

      - name: Verify MQ brokers are ready
        run: |
          echo "Waiting for all MQ brokers to be ready..."
          # RabbitMQ
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/5672) 2>/dev/null; then echo "RabbitMQ ready"; break; fi
            echo "waiting RabbitMQ... ($i)"; sleep 2
          done
          # NATS
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/4222) 2>/dev/null; then echo "NATS ready"; break; fi
            echo "waiting NATS... ($i)"; sleep 2
          done
          # Kafka
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/9092) 2>/dev/null; then echo "Kafka ready"; break; fi
            echo "waiting Kafka... ($i)"; sleep 2
          done
          # ActiveMQ
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/61616) 2>/dev/null; then echo "ActiveMQ ready"; break; fi
            echo "waiting ActiveMQ... ($i)"; sleep 2
          done
          # Pulsar
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/6650) 2>/dev/null; then echo "Pulsar ready"; break; fi
            echo "waiting Pulsar... ($i)"; sleep 2
          done

      - name: RabbitMQ real tests (lapin, AMQP 0.9.1)
        env:
          RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672//
        run: cargo test --package sz-orm-queue --features rabbitmq -- --ignored --nocapture --test-threads=1

      - name: NATS real tests (async-nats)
        env:
          NATS_URL: nats://127.0.0.1:4222
        run: cargo test --package sz-orm-queue --features nats -- --ignored --nocapture --test-threads=1

      - name: ActiveMQ real tests (lapin, AMQP 1.0)
        env:
          ACTIVEMQ_URL: amqp://artemis:artemis@127.0.0.1:61616
        run: cargo test --package sz-orm-queue --features activemq -- --ignored --nocapture --test-threads=1

      - name: Pulsar real tests (pulsar crate)
        env:
          PULSAR_URL: pulsar://127.0.0.1:6650
        run: cargo test --package sz-orm-queue --features pulsar -- --ignored --nocapture --test-threads=1

      - name: Kafka real tests (rdkafka)
        env:
          KAFKA_BROKERS: 127.0.0.1:9092
        run: cargo test --package sz-orm-queue --features kafka -- --ignored --nocapture --test-threads=1

      - name: All-real features compile check
        run: cargo check --package sz-orm-queue --features "all-real" --verbose

  # ============================================================================
  # Job 6: 性能基准测试（v10.13.0 ROI-2 + SDET ROI-5 整改）
  # 2026-10-27 性能评测发现旧 job continue-on-error + `|| echo WARNING` 吞错，
  # 且 `cargo bench` 对无 [[bench]] 目标的包为空转，性能门禁形同虚设。
  # 现改为：真实 DB 基准二进制必须成功执行 + 回归决策门禁测试必须通过。
  # v10.13.0（SDET ROI-5 决策，2026-10-28）：对 main 分支阻断——
  # PR 分支 continue-on-error=true（性能波动不阻塞开发，ADR-005 原意）；
  # main 分支 continue-on-error=false，基准失败或退化 ≥10% 即阻断合入。
  # 基线产物按 90 天留存供跨运行对比。
  # ============================================================================
  benchmark:
    name: Performance Benchmarks (real DB, main-gated)
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 60
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-

      - name: Restore baseline (rolling, 2026-10-28 P1-4)
        uses: actions/cache@v4
        with:
          path: bench-results
          key: bench-baseline-ci-sqlite

      - name: Run real-DB benchmark (SQLite, fail-closed)
        run: |
          # 2026-10-28 P1-4（PERFV2-01 闭环）：
          # - 存在上一轮基线 → --compare-baseline 先比对（≥10% 退化或缺 workload 即阻断），
          #   再 --save-baseline 更新滚动基线（Rust 侧 handle_baseline 已改为先比后存）
          # - 首次运行无基线 → 仅建立基线（下一轮起启用回归门禁）
          if [ -f bench-results/baseline_ci-sqlite.json ]; then
            cargo run --release -p sz-orm-bench --features real-bench -- \
              --db-backend sqlite \
              --db-connection "sqlite://bench-ci.sqlite?mode=rwc" \
              --dataset-size 500 --pool-size 5 --rounds 10 \
              --save-baseline ci-sqlite --compare-baseline ci-sqlite
          else
            echo "首次运行：仅建立基线（下一轮起启用 ≥10% 回归门禁）"
            cargo run --release -p sz-orm-bench --features real-bench -- \
              --db-backend sqlite \
              --db-connection "sqlite://bench-ci.sqlite?mode=rwc" \
              --dataset-size 500 --pool-size 5 --rounds 10 \
              --save-baseline ci-sqlite
          fi

      - name: Regression decision gate (>=10% degradation blocks)
        run: |
          cargo test -p sz-orm-bench --features perf-bench-real \
            --test perf_bench_real_wiring -- --nocapture

      - name: Upload benchmark results & baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ github.sha }}
          path: bench-results/
          retention-days: 90

  # ============================================================================
  # Job 6.5: v0.2.2 修复 P2-4：Soak Test 冒烟验证（Linux 平台）
  #
  # 每次 push/PR 在 Linux 上运行 10 秒 Soak 冒烟测试，验证：
  # - Soak 框架自身正确性（不退化、不 panic）
  # - CSV 报告生成正常
  # - thread_count/RSS/fd_count 字段可读
  # 周末长时 6h Soak 由 soak.yml 周期触发。
  # ============================================================================
  soak-smoke:
    name: Soak Smoke Test (Linux, 10s)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-soak-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-soak-

      - name: Run soak smoke test (10s, non-ignored)
        run: cargo test --package sz-orm-core --test soak soak_smoke_10s -- --nocapture --test-threads=1

      - name: Upload soak smoke CSV report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-smoke-${{ github.sha }}
          path: target/soak-report.csv
          if-no-files-found: warn
          retention-days: 7

  # ============================================================================
  # Job 7: 安全审计
  # ============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run security audit
        run: |
          # v10.13.0 (M-1)：--ignore 列表必须与 deny.toml [advisories].ignore 保持一致
          # v10.13.0 更新：0383/0385/0386/0391/0398/0403 已通过升级消除
          # v10.13.0 (2026-10-28 P0-1 复核)：rustls 0.21 线退出锁文件，0346/0349 ignore 移除（deny.toml 同步）
          cargo audit \
            --no-yanked \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0382 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2026-0221 \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2025-0020 \
            --ignore RUSTSEC-2026-0177 \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369

  # ============================================================================
  # Job 7.5: secrets 凭据泄露扫描（v10.13.0 / 2026-10-27 H-3 整改接入）
  # ============================================================================
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run check-secrets
        run: python scripts/check-secrets.py

  # ============================================================================
  # Job 8: 覆盖率报告（v8.6.0：cargo-llvm-cov，阻断 PR）
  # ============================================================================
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Run coverage (cargo-llvm-cov, fail-under 60)
        run: bash scripts/collect-coverage-linux.sh --output coverage-report.md --json coverage-report.json --fail-under 60

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            lcov.info
            coverage-report.md
            coverage-report.json
          retention-days: 30

  # ============================================================================
  # Job 8.5: 变异测试（v8.6.0 新增，cargo-mutants，阻断 PR）
  # v9.0.0：接入 --include-ignored 车道（DB 服务容器 + 真 DB 回归套件参与杀
  # 变异体），消灭 DB-gated 存活（2026-09-25 审计：sz-orm-sqlx any.rs 9 个
  # 存活的杀手全在 #[ignore] 套件）
  # ============================================================================
  mutation:
    name: Mutation Testing
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test123
          MYSQL_DATABASE: sz_orm_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ptest123"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test123
          POSTGRES_DB: sz_orm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要完整历史以计算 PR/push 的增量 diff（Gate 20 增量变异）
          fetch-depth: 0

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mut-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-mut-

      - name: Install cargo-mutants
        run: cargo install cargo-mutants --locked

      - name: Kill residual cargo-mutants processes
        run: pkill -f cargo-mutants || true

      - name: Generate PR diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          git diff "$BASE"...HEAD > /tmp/pr.diff || true
          echo "diff lines: $(wc -l < /tmp/pr.diff)"

      # 日常门禁：增量变异（分钟级）。全量变异（collect-mutation-linux.sh）
      # 作为发布前门禁分层执行（见 architecture review 风险 2 修复记录）。
      - name: Run incremental mutation (Gate 20 daily, fail-under 70)
        run: |
          if [ -s /tmp/pr.diff ]; then
            # --test-package sz-orm-sqlx：core 的 pool/事务回归测试位于 sz-orm-sqlx 包
            # （如 test_known_good_fast_path_e2e），不指定会造成跨包变异盲区
            # （2026-10-27 SDET 评测 ROI-4：能力已在 collect-mutation-diff.sh 就位，此处启用）。
            bash scripts/collect-mutation-diff.sh --diff /tmp/pr.diff --fail-under 70 --test-package sz-orm-sqlx
          else
            echo "No diff for this run → skip incremental mutation"
          fi
        env:
          SZ_ORM_MYSQL_URL: mysql://root:test123@127.0.0.1:3306/sz_orm_test
          SZ_ORM_PG_URL: postgres://postgres:test123@127.0.0.1:5432/sz_orm_test

      - name: Upload mutation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-${{ github.sha }}
          path: |
            mutants-diff-out/
          retention-days: 30

  # ============================================================================
  # Job 8.6: 下游消费者编译验证（v8.6.0 新增，阻断 PR）
  # ============================================================================
  downstream-compat:
    name: Downstream Compatibility
    runs-on: ubuntu-latest
    needs: [test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run downstream compatibility check
        run: python scripts/check-downstream-compat-auto.py --all --compile --api-diff --json --output compat-report.json

      - name: Upload compatibility report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downstream-compat-${{ github.sha }}
          path: compat-report.json
          retention-days: 30

  # ============================================================================
  # Job 9: Fuzz Testing（P2-3）
  #
  # 使用 cargo-fuzz + libfuzzer 对核心模块进行短时间模糊测试。
  # nightly 工具链（sanitizer 需要 -Zsanitizer=address）。
  # 每个 target 运行 60 秒，发现 panic/crash 即失败。
  # 目标：至少 3 个 fuzz target（query_builder / value_escape / pool_config）。
  # v10.13.0（SDET ROI-5 决策，2026-10-28）：对 main 分支阻断。
  # ============================================================================
  fuzz:
    name: Fuzz Testing (60s per target)
    runs-on: ubuntu-latest
    needs: [test]
    continue-on-error: ${{ github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fuzz-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: "Run fuzz target: query_builder (60s)"
        run: |
          cd fuzz
          cargo +nightly fuzz run query_builder -- -max_total_time=60 -max_len=4096

      - name: "Run fuzz target: value_escape (60s)"
        run: |
          cd fuzz
          cargo +nightly fuzz run value_escape -- -max_total_time=60 -max_len=4096

      - name: "Run fuzz target: pool_config (60s)"
        run: |
          cd fuzz
          cargo +nightly fuzz run pool_config -- -max_total_time=60 -max_len=256

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ github.sha }}
          path: fuzz/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 7

