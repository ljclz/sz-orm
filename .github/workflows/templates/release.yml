name: Reusable Release

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true
      crate_name:
        type: string
        required: true
      token_secret:
        type: string
        required: false
        default: "CARGO_REGISTRY_TOKEN"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --manifest-path ${{ inputs.package }}/Cargo.toml --token ${{ secrets[inputs.token_secret] }}