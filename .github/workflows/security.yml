# =============================================================================
# 安全审计 CI 工作流
# 触发: 推送 / PR 到 main/master 分支
# 内容: cargo-audit (漏洞公告) + cargo-deny (公告 / 禁用 / 许可证 / 来源)
# =============================================================================
name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================================
  # Job 1: cargo-audit 漏洞公告扫描
  # ============================================================================
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-audit-

      - name: Run cargo-audit
        run: |
          # v10.13.0 (M-1)：--ignore 列表必须与 deny.toml [advisories].ignore 保持一致，
          # 否则锁文件中已登记豁免的 advisory 会让本 job 假红。
          # v10.13.0 更新：webpki-root-certs/ctutils/tokio/zstd 已升级消除（0383/0385/0386/0391/0398/0403 移除）。
          # v10.13.0 (2026-10-28 P0-1 复核)：rustls 0.21 线退出锁文件，0346/0349 ignore 移除（deny.toml 同步）。
          cargo audit \
            --no-yanked \
            --ignore RUSTSEC-2026-0049 \
            --ignore RUSTSEC-2026-0098 \
            --ignore RUSTSEC-2026-0099 \
            --ignore RUSTSEC-2026-0104 \
            --ignore RUSTSEC-2026-0382 \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2025-0134 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2023-0071 \
            --ignore RUSTSEC-2026-0097 \
            --ignore RUSTSEC-2026-0221 \
            --ignore RUSTSEC-2026-0235 \
            --ignore RUSTSEC-2025-0020 \
            --ignore RUSTSEC-2026-0177 \
            --ignore RUSTSEC-2026-0258 \
            --ignore RUSTSEC-2026-0367 \
            --ignore RUSTSEC-2026-0368 \
            --ignore RUSTSEC-2026-0369

  # ============================================================================
  # Job 3: secrets 凭据泄露扫描（v10.13.0 / 2026-10-27 H-3 整改接入）
  # ============================================================================
  secret-scanning:
    name: secret-scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run check-secrets
        run: python scripts/check-secrets.py

  # ============================================================================
  # Job 2: cargo-deny 综合检查 (advisories / bans / licenses / sources)
  # ============================================================================
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans
          - licenses
          - sources
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deny-${{ matrix.checks }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-deny-

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny
        run: cargo deny check ${{ matrix.checks }}
