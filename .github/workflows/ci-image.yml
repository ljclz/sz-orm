# CI Image build & publish for sz-orm
# Builds Dockerfile.ci and pushes the resulting image to GitHub Container Registry
# (ghcr.io/ljclz/sz-orm-ci). The image bundles the Rust stable+nightly toolchains,
# cargo helper tools, Python, protoc and system deps used by the CI matrix jobs.
#
# Triggers:
#   - push to main touching Dockerfile.ci or this workflow file
#   - manual workflow_dispatch
#   - weekly schedule (Monday 03:00 UTC) to refresh base image security patches
#
# Tags pushed: latest, <git-sha>, <YYYYMMDD>
# Build cache: GitHub Actions cache (type=gha)
name: CI Image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.ci
      - .github/workflows/ci-image.yml
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # Weekly Monday UTC 03:00

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    name: Build and push CI image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate date tag
        run: echo "DATE_TAG=$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ci
          push: true
          tags: |
            ghcr.io/ljclz/sz-orm-ci:latest
            ghcr.io/ljclz/sz-orm-ci:${{ github.sha }}
            ghcr.io/ljclz/sz-orm-ci:${{ env.DATE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
