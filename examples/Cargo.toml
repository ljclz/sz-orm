[package]
name = "sz-orm-examples"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SZ-ORM 使用示例集"
publish = false

[dependencies]
# v4.7.0 接线生产入口：启用配额/RLS/预热 feature，形成真实生产路径
#（门禁 15 PHANTOM-2 检查：feature 有启用点即不再视为"默认不编译"）
sz-orm-core = { path = "../packages/sz-orm-core", features = ["tenant-quota-rls-enhanced", "l1-cache"] }
sz-orm-crypto = { path = "../packages/sz-orm-crypto" }
sz-orm-auth = { path = "../packages/sz-orm-auth" }
sz-orm-limit = { path = "../packages/sz-orm-limit" }
sz-orm-scheduler = { path = "../packages/sz-orm-scheduler" }
sz-orm-audit = { path = "../packages/sz-orm-audit" }
sz-orm-dtx = { path = "../packages/sz-orm-dtx" }
sz-orm-sharding = { path = "../packages/sz-orm-sharding" }
sz-orm-sqlx = { path = "../packages/sz-orm-sqlx", features = ["async-row-stream", "prepared-stmt-cache"] }
sz-orm-parallel = { path = "../packages/sz-orm-parallel", features = ["parallel-query"] }
sz-orm-stream = { path = "../packages/sz-orm-stream", features = ["stream-resultset"] }
sz-orm-batch = { path = "../packages/sz-orm-batch", features = ["parallel-batch"] }
sz-orm-macros = { path = "../packages/sz-orm-macros" }
sz-orm-fusion = { path = "../packages/sz-orm-fusion" }
sz-orm-observability = { path = "../packages/sz-orm-observability" }
sz-orm-graph = { path = "../packages/sz-orm-graph" }
sz-orm-advisor = { path = "../packages/sz-orm-advisor" }
sz-orm-explain = { path = "../packages/sz-orm-explain" }
tokio = { workspace = true, features = ["full"] }
serde_json = { workspace = true }
async-trait = { workspace = true }

[[bin]]
name = "quick_start"
path = "src/bin/quick_start.rs"

[[bin]]
name = "model_definition"
path = "src/bin/model_definition.rs"

[[bin]]
name = "transaction"
path = "src/bin/transaction.rs"

[[bin]]
name = "migration"
path = "src/bin/migration.rs"

[[bin]]
name = "hooks_soft_delete"
path = "src/bin/hooks_soft_delete.rs"

[[bin]]
name = "multi_tenant"
path = "src/bin/multi_tenant.rs"

[[bin]]
name = "production_app"
path = "src/bin/production_app.rs"

[[bin]]
name = "production_dtx"
path = "src/bin/production_dtx.rs"

[[bin]]
name = "real_db_crud"
path = "src/bin/real_db_crud.rs"

[[bin]]
name = "db_verify_test"
path = "src/bin/db_verify_test.rs"
required-features = ["sz-orm-macros/db-verify"]

[[bin]]
name = "sz_rust_integration_example"
path = "src/bin/sz_rust_integration_example.rs"

[[bin]]
name = "sz_pay_pattern"
path = "src/bin/sz_pay_pattern.rs"

[[bin]]
name = "parallel_queries_demo"
path = "src/bin/parallel_queries_demo.rs"

[[bin]]
name = "batch_parallel_demo"
path = "src/bin/batch_parallel_demo.rs"

[[bin]]
name = "parallel_join_demo"
path = "src/bin/parallel_join_demo.rs"

[[bin]]
name = "prepared_cache_demo"
path = "src/bin/prepared_cache_demo.rs"

[[bin]]
name = "stream_unified_demo"
path = "src/bin/stream_unified_demo.rs"

[[bin]]
name = "backpressure_stream_demo"
path = "src/bin/backpressure_stream_demo.rs"

[[bin]]
name = "composable_plugin_demo"
path = "src/bin/composable_plugin_demo.rs"
required-features = ["composable-plugin"]

[[bin]]
name = "tde_demo"
path = "src/bin/tde_demo.rs"
required-features = ["tde-interceptor"]

[[bin]]
name = "multi_region_demo"
path = "src/bin/multi_region_demo.rs"
required-features = ["multi-region"]

[[bin]]
name = "serverless_demo"
path = "src/bin/serverless_demo.rs"
required-features = ["serverless-adapt"]

[[bin]]
name = "stream_processing_demo"
path = "src/bin/stream_processing_demo.rs"
required-features = ["stream-processing"]

[[bin]]
name = "nl_query_demo"
path = "src/bin/nl_query_demo.rs"
required-features = ["ai-nl-query"]

[[bin]]
name = "graph_traversal_demo"
path = "src/bin/graph_traversal_demo.rs"
required-features = ["graph-traversal"]

[[bin]]
name = "cdc_realtime_sync_demo"
path = "src/bin/cdc_realtime_sync_demo.rs"
required-features = ["cdc-realtime-sync"]

[[bin]]
name = "dist_coordination_demo"
path = "src/bin/dist_coordination_demo.rs"
required-features = ["dist-coordination"]

[[bin]]
name = "rbac_abac_demo"
path = "src/bin/rbac_abac_demo.rs"
required-features = ["rbac-abac-enhanced"]

[[bin]]
name = "query_auto_tuning_demo"
path = "src/bin/query_auto_tuning_demo.rs"
required-features = ["query-auto-tuning"]

[[bin]]
name = "olap_vectorized_demo"
path = "src/bin/olap_vectorized_demo.rs"
required-features = ["olap-vectorized"]

[features]
default = []
# 启用 query! 宏的编译期连真 DB 验证能力
db-verify = ["sz-orm-macros/db-verify"]
# v3.4.0：sz-pay 生产案例示例
sz-pay-example = []
# v7.0.0：可组合性插件系统示例
composable-plugin = ["sz-orm-core/composable-plugin"]
# v7.0.0：TDE 透明数据加密示例
tde-interceptor = ["sz-orm-core/tde-interceptor"]
# v7.0.0：多区域多活示例
multi-region = ["sz-orm-fusion/multi-region"]
# v7.0.0：Serverless 适配示例
serverless-adapt = ["sz-orm-core/serverless-adapt", "sz-orm-observability/serverless-metering"]
# v7.0.0：实时流处理示例
stream-processing = ["sz-orm-stream/stream-processing"]
# v7.1.0：AI 自然语言查询示例
ai-nl-query = ["sz-orm-advisor/ai-nl-query"]
# v7.1.0：图遍历查询示例
graph-traversal = ["sz-orm-graph/graph-traversal"]
# v7.1.0：CDC 实时数据同步示例
cdc-realtime-sync = ["sz-orm-stream/cdc-realtime-sync", "sz-orm-core/cdc-realtime-sync"]
# v7.1.0：分布式协调示例
dist-coordination = ["sz-orm-dtx/dist-coordination"]
# v7.1.0：RBAC + ABAC 权限模型增强示例
rbac-abac-enhanced = ["sz-orm-auth/rbac-abac-enhanced", "sz-orm-core/rbac-abac-enhanced"]
# v7.1.0：查询自调优示例
query-auto-tuning = ["sz-orm-advisor/query-auto-tuning"]
# v7.1.0：OLAP 向量化分析查询示例
olap-vectorized = ["sz-orm-core/olap-vectorized", "sz-orm-parallel/olap-vectorized"]

[lints]
workspace = true
