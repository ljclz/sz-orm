version: '3.8'

services:
  neo4j:
    image: neo4j:5-community
    container_name: sz-orm-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      - NEO4J_AUTH=neo4j/test123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  neo4j_data:
  neo4j_logs: