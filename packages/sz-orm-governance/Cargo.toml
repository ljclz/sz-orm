[package]
name = "sz-orm-governance"
description = "AI-driven data governance: lineage, quality, compliance, masking"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sz-orm-ai = { version = "9.0.0", path = "../sz-orm-ai", optional = true }
sz-orm-graph = { version = "9.0.0", path = "../sz-orm-graph", optional = true }
sz-orm-masking = { version = "9.0.0", path = "../sz-orm-masking", optional = true }
sz-orm-core = { version = "9.0.0", path = "../sz-orm-core", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
chrono = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
regex = { version = "1", optional = true }
rand = { workspace = true, optional = true }
# v7.8.0 数据生命周期管理依赖
sz-orm-fusion = { version = "9.0.0", path = "../sz-orm-fusion", optional = true }
parking_lot = { workspace = true, optional = true }
# v7.9.0 合规证据链依赖
sz-orm-audit = { version = "9.0.0", path = "../sz-orm-audit", optional = true }

[features]
default = []
governance = ["dep:sz-orm-ai", "dep:sz-orm-masking", "dep:serde", "dep:serde_json", "dep:chrono", "dep:async-trait", "dep:tokio", "dep:tracing", "sz-orm-ai/multi-llm"]
governance-lineage = ["governance", "dep:sz-orm-graph", "dep:sz-orm-core"]
governance-compliance = ["governance"]
# v6.7.0：合规报告生成（聚合审计/权限/加密/脱敏清单）
compliance-report = ["dep:serde", "dep:serde_json"]
# v6.8.0：SLA 监控
sla-monitor = ["dep:serde", "dep:serde_json"]
# v6.8.0：成本治理核算 + 超预算告警
cost-governance = ["dep:serde", "dep:serde_json"]
# v6.8.0：敏感数据自动发现 + 脱敏样例 + masking 联动
sensitive-discover = ["governance", "dep:regex", "dep:rand"]
# v7.8.0 数据生命周期管理：规则引擎 + 冷热分离 + 归档 + TTL 清理
data-lifecycle-mgmt = ["governance", "dep:sz-orm-fusion", "sz-orm-fusion/db-fusion-v2", "dep:parking_lot"]
# v7.8.0 冷热分离迁移
data-cold-hot-split = ["data-lifecycle-mgmt"]
# v7.8.0 自动归档
data-auto-archive = ["data-lifecycle-mgmt"]
# v7.9.0 跨存储生命周期编排：多级存储金字塔 + 成本模拟 + 合规证据链
cross-storage-lifecycle = ["data-lifecycle-mgmt", "dep:sz-orm-audit"]
# v7.9.0 联邦查询路由（依赖 cross-storage-lifecycle）
federated-query = ["cross-storage-lifecycle"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json"] }
# v7.8.0 跨模块联动 e2e 测试
sz-orm-mig = { path = "../sz-orm-mig", features = ["gray-release"] }

[lints]
workspace = true

[[test]]
name = "lineage_build"
path = "tests/lineage_build.rs"
required-features = ["governance-lineage"]

[[test]]
name = "compliance_audit"
path = "tests/compliance_audit.rs"
required-features = ["governance-compliance"]

[[test]]
