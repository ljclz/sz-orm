[package]
name = "sz-orm-dtx"
description = "Distributed tx: 2PC coordinator, Saga orchestration, TCC compensation, XA transaction"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt", "sync"] }
# 锁毒化修复：使用 parking_lot 替代 std::sync，消除 .lock().unwrap() panic 风险
parking_lot.workspace = true

# XA 事务支持（feature 隔离，默认关闭）
sz-orm-sqlx = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
thiserror = { version = "2", optional = true }
chrono = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "postgres"], optional = true }

# 跨语言分布式事务支持（feature 隔离，默认关闭）
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true, features = ["tls-ring"] }
tonic-prost = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", optional = true }
sz-orm-grpc = { version = "4.8.0", path = "../sz-orm-grpc", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[features]
default = []
# v4.9.0：OWASP Top 10 完整覆盖渗透测试套件（编译门控，默认关闭）
owasp-pentest-suite = []
# XA 事务支持（直连 DB 资源管理器 + 崩溃恢复 + 悬挂检测）
xa = ["dep:sz-orm-sqlx", "dep:async-trait", "dep:thiserror", "dep:chrono", "dep:tracing", "tokio/time"]
# 真实数据库集成测试（需 xa + 真实数据库连接）
real-db = ["xa", "dep:sqlx"]
# 跨语言分布式事务（gRPC/HTTP 参与者协议 + 适配器 + 补偿序列化 + 注册中心 + 告警 + 可观测 + 真实 tonic/reqwest 传输 + 崩溃恢复 + Saga/TCC 编排 + SDK 契约）
cross-lang-dtx = ["dep:prost", "dep:tonic", "dep:tonic-prost", "dep:tokio-stream", "dep:sz-orm-grpc", "dep:async-trait", "dep:thiserror", "dep:chrono", "dep:tracing", "dep:reqwest", "dep:tonic-prost-build", "dep:protoc-bin-vendored", "tokio/time", "tokio/rt-multi-thread"]

[[test]]
name = "blackhat_poc"
required-features = ["cross-lang-dtx"]

[[test]]
name = "owasp_race_conditions"
required-features = ["owasp-pentest-suite"]

[lints]
workspace = true
