[package]
name = "sz-orm-dtx"
description = "Distributed tx: 2PC coordinator, Saga orchestration, TCC compensation, XA transaction"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"


[package.metadata.cargo-machete]
ignored = ['prost', 'sz-orm-grpc', 'tonic-prost']
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["rt", "sync"] }
# 锁毒化修复：使用 parking_lot 替代 std::sync，消除 .lock().unwrap() panic 风险
parking_lot.workspace = true

# XA 事务支持（feature 隔离，默认关闭）
sz-orm-sqlx = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
thiserror = { version = "2", optional = true }
chrono = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
sqlx = { version = "0.9", features = ["runtime-tokio", "mysql", "postgres"], optional = true }

# 跨语言分布式事务支持（feature 隔离，默认关闭）
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true, features = ["tls-ring"] }
tonic-prost = { version = "0.14", optional = true }
tokio-stream = { version = "0.1", optional = true }
sz-orm-grpc = { version = "9.0.0", path = "../sz-orm-grpc", optional = true }
reqwest = { version = "0.12", features = ["json"], optional = true }
# v7.1.0：分布式协调（Redis 后端）
redis = { workspace = true, optional = true }
# v8.0.0 组4：端到端接线测试需要 fusion（bi_sync）和 core（cache_coherent）
sz-orm-fusion = { version = "9.0.0", path = "../sz-orm-fusion", optional = true }
sz-orm-core = { version = "9.0.0", path = "../sz-orm-core", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[features]
default = []
# v4.9.0：OWASP Top 10 完整覆盖渗透测试套件（编译门控，默认关闭）
owasp-pentest-suite = []
# XA 事务支持（直连 DB 资源管理器 + 崩溃恢复 + 悬挂检测）
xa = ["dep:sz-orm-sqlx", "dep:async-trait", "dep:thiserror", "dep:chrono", "dep:tracing", "tokio/time"]
# 真实数据库集成测试（需 xa + 真实数据库连接）
real-db = ["xa", "dep:sqlx"]
# 跨语言分布式事务（gRPC/HTTP 参与者协议 + 适配器 + 补偿序列化 + 注册中心 + 告警 + 可观测 + 真实 tonic/reqwest 传输 + 崩溃恢复 + Saga/TCC 编排 + SDK 契约）
cross-lang-dtx = ["dep:prost", "dep:tonic", "dep:tonic-prost", "dep:tokio-stream", "dep:sz-orm-grpc", "dep:async-trait", "dep:thiserror", "dep:chrono", "dep:tracing", "dep:reqwest", "dep:tonic-prost-build", "dep:protoc-bin-vendored", "tokio/time", "tokio/rt-multi-thread"]
# v7.1.0：分布式协调（分布式锁 + Leader 选举 + 服务注册/发现）
dist-coordination = ["dep:async-trait", "dep:thiserror", "dep:tracing", "dep:redis", "tokio/time", "tokio/macros"]
# v7.6.0：Saga 增强（自动补偿 + 重试 + 幂等）
saga-enhanced = []
# v7.6.0：2PC 原子性增强
two-pc-enhanced = ["xa"]
# v7.6.0：3PC 三阶段提交
three-pc = ["xa"]
# v7.7.0 任务 3.1：跨事务一致性验证
cross-tx-consistency = ["dep:thiserror"]
# v8.0.0：分布式增强聚合
dist-enhance = []
dtx-saga-coordinator = ["dist-enhance", "saga-enhanced", "dep:sz-orm-fusion", "dep:sz-orm-core", "sz-orm-fusion/dist-sync-bi", "sz-orm-core/dist-cache-coherent"]

dist-consensus = ["raft-optimize", "split-brain-detect", "consistency-tunable", "dep:sz-orm-fusion", "sz-orm-fusion/cross-region-replicate", "sz-orm-fusion/split-brain-detect"]
raft-optimize = ["dist-coordination"]
split-brain-detect = ["dist-coordination"]
consistency-tunable = []
[[test]]
name = "blackhat_poc"
required-features = ["cross-lang-dtx"]

[[test]]
name = "owasp_race_conditions"
required-features = ["owasp-pentest-suite"]

[lints]
workspace = true
[dev-dependencies]
tokio = { version = "1.40", features = ["full", "test-util"] }

[[test]]
name = "coordination_lock_wiring"
path = "tests/coordination_lock_wiring.rs"
required-features = ["dist-coordination"]

[[test]]
name = "coordination_leader_wiring"
path = "tests/coordination_leader_wiring.rs"
required-features = ["dist-coordination"]

# v7.6.0 组3.9：Saga 补偿增强端到端测试
[[test]]
name = "saga_compensation_enhanced_test"
path = "tests/saga_compensation_enhanced_test.rs"

# v7.6.0 组3.9：3PC 端到端测试
[[test]]
name = "three_pc_test"
path = "tests/three_pc_test.rs"
required-features = ["three-pc"]
# v7.7.0 任务 3.6：跨事务一致性验证端到端测试
[[test]]
name = "cross_tx_consistency_test"
path = "tests/cross_tx_consistency_test.rs"
required-features = ["cross-tx-consistency"]
# v8.0.0 组4：分布式增强端到端接线测试
[[test]]
name = "dist_enhance_wiring"
path = "tests/dist_enhance_wiring.rs"
required-features = ["dtx-saga-coordinator"]
# v8.1.0 组4：分布式共识优化端到端接线测试
[[test]]
name = "dist_consensus_wiring"
path = "tests/dist_consensus_wiring.rs"
required-features = ["dist-consensus"]
