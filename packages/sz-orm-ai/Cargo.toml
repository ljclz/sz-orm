[[test]]
name = "llm_security_audit_test"
path = "tests/llm_security_audit_test.rs"
required-features = ["ai-security-audit"]

[[test]]
name = "performance_predictor_test"
path = "tests/performance_predictor_test.rs"
required-features = ["llm-optimizer"]

[[test]]
name = "ab_test_test"
path = "tests/ab_test_test.rs"
required-features = ["llm-optimizer"]

[[test]]
name = "injection_pattern_learning_test"
path = "tests/injection_pattern_learning_test.rs"
required-features = ["ai-security-audit"]

[[test]]
name = "permission_audit_test"
