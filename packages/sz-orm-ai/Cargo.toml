[package]
name = "sz-orm-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SZ-ORM AI Extension - Embedding, Vector Store, RAG Engine"

[features]
default = []
# 启用真实 OpenAI 兼容 API 客户端（HTTP 调用）
real = ["dep:reqwest", "dep:base64"]
# 启用 LLM 查询计划优化器（依赖 real feature 与 reqwest HTTP 客户端）
llm-optimizer = ["real"]
# v3.2.0：查询计划缓存转发
plan-cache = ["dep:sz-orm-core", "sz-orm-core/plan-cache"]
# v3.3.0 M4：AI 自然语言查询增强
ai-nl2sql-enhanced = []
ai-index-advisor = ["dep:sqlparser"]
ai-rewrite-advisor = ["dep:sqlparser"]
# v4.0.0 M1：多 LLM 模型支持（Claude/Gemini/Ollama/OpenAI + 热切换 + fallback）
multi-llm = ["dep:reqwest", "dep:base64", "dep:tracing"]
# v4.0.0 M2：AI 自动调优闭环（Detect→Advise→Apply→Verify，复用既有优化器）
ai-auto-tuning = ["llm-optimizer", "ai-index-advisor", "ai-rewrite-advisor"]
# v5.1.0：NL2SQL Schema 自动提取（需传入 Connection，未启用时零编译开销）
ai-schema-extract = ["dep:sz-orm-core"]
# v5.1.0：LLM 安全审计（规则引擎未识别时调用 LLM 二次判断）
ai-security-audit = ["multi-llm"]
# v5.1.0 P2：语义查询路由（SQL/向量/图谱/Agent/混合）
ai-native-query = ["ai-nl2sql-enhanced", "multi-llm", "dep:sz-orm-graph"]
# v7.3.0 任务 3.1：AI 配置聚合与决策结果聚合
ai-config = []
# v7.5.0 AI 索引落地执行器（默认关闭）
ai-index-apply = ["ai-index-advisor"]
# v7.5.0 AI 查询计划预测器（默认关闭）
ai-plan-predict = ["ai-config", "llm-optimizer"]
# v7.6.0 复杂 SQL + 多轮对话追问澄清（默认关闭）
ai-nl2sql-complex = ["ai-config", "ai-nl2sql-enhanced"]
# v7.7.0 查询计划自动优化（改写 + 索引提示 + 并行提示）
plan-auto-optimize = ["ai-config", "llm-optimizer"]
# v7.7.0 任务 2.1：AiQueryOptimizer AI 驱动查询优化（默认关闭）
ai-query-optimize = ["ai-config", "ai-rewrite-advisor"]
# v7.7.0 任务 2.2：索引全生命周期管理（默认关闭）
ai-index-lifecycle = ["ai-config", "ai-index-advisor"]
# v7.7.0 任务 2.4：NL2SQL 深化（意图理解 + 复杂查询分解）
ai-nl2sql-deepen = ["ai-config", "ai-nl2sql-complex"]
# v7.8.0 AI 自治闭环：策略引擎 + 边界校验 + 熔断 + 幂等 + 动作执行 + 验证循环
ai-autonomous-loop = ["ai-config", "dep:sz-orm-anomaly", "sz-orm-anomaly/anomaly-predict", "dep:sz-orm-health", "sz-orm-health/self-heal", "dep:sz-orm-adaptive", "sz-orm-adaptive/adaptive-query", "dep:sz-orm-explain", "sz-orm-explain/slow-query-governance", "dep:sz-orm-audit"]
# v7.8.0 AI 自治自动修复执行
ai-auto-remediation = ["ai-autonomous-loop"]
# v7.8.0 AI 自治自动扩缩容执行
ai-auto-scaling = ["ai-autonomous-loop"]
# v7.8.0 AI 自治自动调参执行
ai-auto-tuning-exec = ["ai-autonomous-loop"]
# v7.9.0 AI 自治闭环生产化：决策可解释性 + A/B 测试 + 冲突仲裁 + 回放
autonomous-xai = ["ai-autonomous-loop"]
# v7.9.0 A/B 测试编排（依赖 autonomous-xai）
autonomous-ab-test = ["autonomous-xai"]
# v8.0.0 AI 能力深化聚合
ai-deep = ["ai-nl-rewrite", "ai-schema-design", "ai-anomaly-predict"]
ai-nl-rewrite = ["dep:sz-orm-audit", "dep:sz-orm-masking", "sz-orm-masking/dynamic-masking", "llm-optimizer"]
ai-schema-design = ["dep:sz-orm-audit", "dep:sz-orm-masking", "sz-orm-masking/dynamic-masking", "dep:sz-orm-ai-designer", "sz-orm-ai-designer/ai-schema-design", "ai-index-advisor"]
ai-anomaly-predict = ["dep:sz-orm-audit", "dep:sz-orm-masking", "sz-orm-masking/dynamic-masking", "dep:sz-orm-anomaly", "sz-orm-anomaly/anomaly-predict"]


ai-autonomous = ["ai-closed-loop", "ai-ab-testing", "ai-model-versioning"]
ai-closed-loop = ["ai-autonomous-loop"]
ai-ab-testing = ["autonomous-xai"]
ai-model-versioning = ["multi-llm"]
[package.metadata.cargo-machete]
ignored = ['base64']
[dependencies]
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# real feature 可选依赖
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
base64 = { version = "0.22", optional = true }

# v4.0.0 M1：fallback 降级日志（multi-llm feature）
tracing = { workspace = true, optional = true }
# 锁毒化修复：使用 parking_lot 替代 std::sync，消除 .write().unwrap() panic 风险
parking_lot.workspace = true
# v3.2.0：查询计划缓存（plan-cache feature，可选依赖）
sz-orm-core = { version = "9.0.0", path = "../sz-orm-core", optional = true }
# v3.3.0 M4：SQL 解析（索引建议 + 重写建议，optional）
sqlparser = { workspace = true, optional = true }
# v5.1.0 P2：图谱查询集成（ai-native-query feature）
sz-orm-graph = { version = "9.0.0", path = "../sz-orm-graph", optional = true }
# v7.8.0 AI 自治闭环依赖
sz-orm-anomaly = { version = "9.0.0", path = "../sz-orm-anomaly", optional = true }
sz-orm-health = { version = "9.0.0", path = "../sz-orm-health", optional = true }
sz-orm-adaptive = { version = "9.0.0", path = "../sz-orm-adaptive", optional = true }
sz-orm-explain = { version = "9.0.0", path = "../sz-orm-explain", optional = true }
sz-orm-audit = { version = "9.0.0", path = "../sz-orm-audit", optional = true }
# v8.0.0 AI 能力深化依赖
sz-orm-masking = { version = "9.0.0", path = "../sz-orm-masking", optional = true }
sz-orm-ai-designer = { version = "9.0.0", path = "../sz-orm-ai-designer", optional = true }



[dev-dependencies]
tokio-test = "0.4"

sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "sqlite", "chrono", "json"] }
# v7.8.0 跨模块联动 e2e 测试
sz-orm-observability = { path = "../sz-orm-observability", features = ["slo-automation"] }

