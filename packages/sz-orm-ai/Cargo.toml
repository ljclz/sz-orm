[package]
name = "sz-orm-ai"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SZ-ORM AI Extension - Embedding, Vector Store, RAG Engine"

[features]
default = []
# 鍚敤鐪熷疄 OpenAI 鍏煎 API 瀹㈡埛绔紙HTTP 璋冪敤锟?
real = ["dep:reqwest", "dep:base64"]
# 鍚敤 LLM 鏌ヨ璁″垝浼樺寲鍣紙渚濊禆 real feature 锟?reqwest HTTP 瀹㈡埛绔級
llm-optimizer = ["real"]
# v3.2.0锛氭煡璇㈣鍒掔紦瀛樿浆锟?
plan-cache = ["dep:sz-orm-core", "sz-orm-core/plan-cache"]
# v3.3.0 M4锛欰I 鑷劧璇█鏌ヨ澧炲己
ai-nl2sql-enhanced = []
ai-index-advisor = ["dep:sqlparser"]
ai-rewrite-advisor = ["dep:sqlparser"]
# v4.0.0 M1锛氬 LLM 妯″瀷鏀寔锛圕laude/Gemini/Ollama/OpenAI + 鐑垏锟?+ fallback锟?
multi-llm = ["dep:reqwest", "dep:base64", "dep:tracing"]
# v4.0.0 M2锛欰I 鑷姩璋冧紭闂幆锛圖etect鈫扐dvise鈫扐pply鈫扸erify锛屽鐢ㄦ棦鏈変紭鍖栧櫒锟?
ai-auto-tuning = ["llm-optimizer", "ai-index-advisor", "ai-rewrite-advisor"]
# v5.1.0：NL2SQL Schema 自动提取（需传入 Connection，未启用时零编译开销）
ai-schema-extract = ["dep:sz-orm-core"]
# v5.1.0：LLM 安全审计（规则引擎未识别时调用 LLM 二次判断）
ai-security-audit = ["multi-llm"]
# v5.1.0 P2：语义查询路由（SQL/向量/图谱/Agent/混合）
ai-native-query = ["ai-nl2sql-enhanced", "multi-llm", "dep:sz-orm-graph"]


[package.metadata.cargo-machete]
ignored = ['base64']
[dependencies]
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# real feature 鍙€変緷锟?
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
base64 = { version = "0.22", optional = true }

# v4.0.0 M1锛歠allback 闄嶇骇鏃ュ織锛坢ulti-llm feature锟?
tracing = { workspace = true, optional = true }
# 閿佹瘨鍖栦慨澶嶏細浣跨敤 parking_lot 鏇夸唬 std::sync锛屾秷锟?.write().unwrap() panic 椋庨櫓
parking_lot.workspace = true
# v3.2.0锛氭煡璇㈣鍒掔紦瀛橈紙plan-cache feature锛屽彲閫変緷璧栵級
sz-orm-core = { version = "6.0.0", path = "../sz-orm-core", optional = true }
# v3.3.0 M4锛歋QL 瑙ｆ瀽锛堢储寮曞缓锟?+ 閲嶅啓寤鸿锛宱ptional锟?
sqlparser = { workspace = true, optional = true }
# v5.1.0 P2：图谱查询集成（ai-native-query feature）
sz-orm-graph = { version = "6.0.0", path = "../sz-orm-graph", optional = true }

[dev-dependencies]
tokio-test = "0.4"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json"] }

[[test]]
name = "ai_tests"
path = "tests/ai_tests.rs"

[[test]]
name = "llm_integration"
path = "tests/llm_integration.rs"
required-features = ["llm-optimizer"]

[[test]]
name = "ai_m4"
path = "tests/ai_m4.rs"
