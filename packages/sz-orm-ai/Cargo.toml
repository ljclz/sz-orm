[[test]]
name = "hybrid_query_test"
path = "tests/hybrid_query_test.rs"
required-features = ["ai-native-query"]

[[test]]
name = "nl2sql_mysql_e2e"
path = "tests/nl2sql_mysql_e2e.rs"
required-features = ["ai-nl2sql-enhanced"]

[lints]
workspace = true
