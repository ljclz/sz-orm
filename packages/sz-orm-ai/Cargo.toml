required-features = ["ai-security-audit"]

[[test]]
name = "semantic_query_test"
path = "tests/semantic_query_test.rs"
required-features = ["ai-native-query"]

[[test]]
name = "graph_integration_test"
path = "tests/graph_integration_test.rs"
required-features = ["ai-native-query"]

[[test]]
name = "ai_agent_test"
path = "tests/ai_agent_test.rs"
