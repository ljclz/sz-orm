[package]
name = "sz-orm-wasm"
description = "WebAssembly: run Rust ORM code in browser via WASM targets"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }
web-sys = { version = "0.3", optional = true, features = [

    "Window",
] }
thiserror = { version = "2.0", optional = true }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["json"] }
tokio-tungstenite = { version = "0.24", optional = true }
rmp-serde = { version = "1.3", optional = true }
chrono = { workspace = true, optional = true }

[features]
default = []
js = ["dep:wasm-bindgen", "dep:js-sys"]
persistence = ["dep:web-sys", "dep:thiserror", "js"]
wasm-real-db = ["dep:reqwest", "dep:tokio-tungstenite", "dep:rmp-serde", "dep:thiserror", "dep:chrono", "js"]
wasi-socket = ["wasm-real-db"]

[dev-dependencies]
wasm-bindgen-test = "0.2"

[lints]
workspace = true
