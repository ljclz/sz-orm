[package]
name = "sz-orm-explain"
description = "Cross-dialect EXPLAIN result parser: full-table-scan / missing-index detection, plan regression checks"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.3.0 M1：EXPLAIN 分析能力（基线快照 JSON 序列化 + 回归检测）
explain-analyzer = ["dep:serde", "dep:serde_json"]

[dependencies]
# 注意：本包刻意零依赖 sz-orm-core，避免 core → macros → explain → core 依赖循环
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[lints]
workspace = true
