[package]
name = "sz-orm-macros"
description = "Procedural macros: Model derive, sql_string!, query! and code gen helpers"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
proc-macro = true

[dependencies]
# 用于构建类型安全的 TokenStream（避免字符串解析失败）
quote = { version = "1.0", default-features = false }
proc-macro2 = { version = "1.0", default-features = false, features = ["proc-macro"] }
# syn 用于解析 derive 宏输入（#[derive(Schema)]、#[derive(Builder)] 等需要它）
syn = { version = "2.0", features = ["full", "parsing", "derive", "extra-traits"] }
# query! 宏可选连真实 DB 验证（通过 SZ_ORM_QUERY_VERIFY=1 + DATABASE_URL 启用）
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite"], optional = true }
tokio = { workspace = true, features = ["full"], optional = true }
# 离线缓存验证：解析 .sz-orm/query-cache.json
serde_json = { version = "1.0", optional = true }
# v4.3.0 M1-T3：EXPLAIN 结果分析（全表扫描/缺失索引编译期警告）
sz-orm-explain = { workspace = true, optional = true }

[features]
default = []
# 启用 query! 宏的编译期连真实 DB 验证能力（含离线缓存模式）
db-verify = ["dep:sqlx", "dep:tokio", "dep:serde_json", "dep:sz-orm-explain"]
# v3.4.0：类型安全列引用（Schema derive 生成列名常量）
type-safe-columns = []
# v3.4.0：类型化 Schema（为复杂类型字段生成告警并跳过）
typed-schema = []
# v3.6.0：自定义编译期诊断信息（与 sz-orm-core/typed-dsl 配合使用）
typed-dsl = []
# v3.7.0: stable（自定义编译期诊断信息，独立 feature gate）
custom-diagnostic = []
# v3.9.0：数据验证派生宏（#[derive(Validate)]）
data-validation = []
# v4.3.0 M3：数据治理派生宏（#[derive(Governed)]，由 sz-orm-core/compile-governance 启用）
governance-derive = []

[dev-dependencies]
sz-orm-core = { path = "../sz-orm-core" }
trybuild = { version = "1.0", default-features = false }

[[test]]
name = "typed_ast_diagnostic_test"
required-features = ["typed-dsl"]

# M3-T5: 自定义诊断测试（需 custom-diagnostic feature）
[[test]]
name = "custom_diagnostic_test"
required-features = ["custom-diagnostic"]

[lints]
workspace = true
