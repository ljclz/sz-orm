[package]
name = "sz-orm-studio"
description = "Web GUI data browser for SZ-ORM (axum HTTP server)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[features]
developer-portal = []
[[bin]]
name = "sz-orm-studio"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { workspace = true }
tower-http = { version = "0.6", features = ["cors", "trace"] }
serde = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[lints]
workspace = true

[[test]]
name = "studio_e2e"
path = "tests/studio_e2e.rs"
[[test]]
name = "server_unit_test"
path = "tests/server_unit_test.rs"

# feature 门控依赖：cargo-machete 静态扫描不可见其 feature 引用（2026-09-26 审计 G23 登记豁免）
[package.metadata.cargo-machete]
ignored = ["tracing"]
