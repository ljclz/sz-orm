[package]
name = "sz-orm-python"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
authors = ["SZ-ORM Team"]
license = "MIT"
description = "Python bindings for sz-orm-core (PyO3): Model, QueryBuilder, Pool, Transaction"
repository = "https://github.com/ljclz/sz-orm"
keywords = ["orm", "database", "python", "pyo3", "ffi"]
categories = ["database", "api-bindings"]

[lib]
name = "sz_orm_python"
crate-type = ["cdylib", "rlib"]


[package.metadata.cargo-machete]
ignored = ['pyo3-asyncio']
[dependencies]
sz-orm-core = { workspace = true }
sz-orm-sqlx = { path = "../sz-orm-sqlx" }
pyo3 = { version = "0.20", features = ["extension-module"] }
pyo3-asyncio = "0.20"
tokio = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_op_in_unsafe_fn = "allow"
non_local_definitions = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
type_complexity = "allow"