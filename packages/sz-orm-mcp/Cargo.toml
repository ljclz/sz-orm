[package]
name = "sz-orm-mcp"
description = "MCP (Model Context Protocol) server for sz-orm: NL query + SQL execution as AI tools"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sz-orm-nl-query = { version = "9.0.0", path = "../sz-orm-nl-query", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

[features]
default = []
mcp = ["dep:sz-orm-nl-query", "dep:tokio", "dep:async-trait", "sz-orm-nl-query/nl-query"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "chrono", "json"] }

[lints]
workspace = true

[[test]]
name = "mcp_mysql_e2e"
path = "tests/mcp_mysql_e2e.rs"
required-features = ["mcp"]

# feature 门控依赖：cargo-machete 静态扫描不可见其 feature 引用（2026-09-26 审计 G23 登记豁免）
[package.metadata.cargo-machete]
ignored = ["async-trait"]
