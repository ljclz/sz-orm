description = "SZ-ORM 鍙娴嬫€фā鍧楋細Prometheus exporter (TcpListener) + SLO 鐕冪儳锟?+ Grafana 浠〃鐩樻ā鏉匡紱OTLP 瀵煎嚭璇蜂娇锟?sz-orm-tracing 锟?otlp feature"

[features]
default = []
# 鍚敤 Prometheus exporter锛堟毚锟?/metrics HTTP 绔偣锛屽熀锟?tokio TcpListener锟?
# 娉細start_metrics_server 濮嬬粓鍙敤锛屾 feature 淇濈暀渚涙湭鏉ユ墿灞曪紙锟?hyper 瀹炵幇锟?
prometheus = []
# 鍚敤鐪熷疄 Pushgateway HTTP PUT 鎺ㄩ€侊紙鍩轰簬 reqwest锟?
# 鏈惎鐢ㄦ椂 PushgatewayExporter::push 浠呰褰曞埌鍐呭瓨锛堢敤浜庢祴璇曪級
push-gateway = ["reqwest"]
# v3.8.0锛歮etrics 绔偣璁块棶鎺у埗
prod-metrics-acl = ["dep:base64", "dep:subtle"]
# v4.0.0 M9锛氭湇鍔＄綉鏍奸泦鎴愶紙Istio/Linkerd + mTLS + 娴侀噺娌荤悊 + sidecar 娉ㄥ叆 + 鍙娴嬫€э級
service-mesh = ["dep:sz-orm-limit"]
# v4.4.0 M4：结构化查询日志（QueryLogger + 采样率 + 级别控制 + 参数脱敏）
query-logging = ["dep:sz-orm-flamegraph", "dep:sz-orm-masking"]
# v4.6.0 M6：异常检测（AnomalyDetector + 3σ/IQR/Z-Score + 滑动窗口 + 告警）
anomaly-detection = []
# v4.7.0 M6：异常自愈与根因分析（自动修复 + RCA + 关联分析）
anomaly-remediation-rca = ["anomaly-detection"]


[package.metadata.cargo-machete]
ignored = ['async-trait', 'chrono', 'sz-orm-core', 'sz-orm-limit', 'thiserror']
[dependencies]
sz-orm-core = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
# 鐪熷疄 Pushgateway HTTP PUT 鎺ㄩ€侊紙鍙€夛紝閫氳繃 push-gateway feature 鍚敤锟?
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"], optional = true }
# v3.8.0锛歮etrics 璁块棶鎺у埗锛坧rod-metrics-acl feature锟?
base64 = { version = "0.22", optional = true }
subtle = { version = "2.5", optional = true }
# v4.0.0 M9锛氭湇鍔＄綉鏍奸檺娴佺啍鏂紙service-mesh feature锟?
sz-orm-limit = { version = "5.0.0", path = "../sz-orm-limit", optional = true }
# v4.4.0 M4：结构化查询日志（query-logging feature）
sz-orm-flamegraph = { path = "../sz-orm-flamegraph", version = "5.0.0", optional = true }
sz-orm-masking = { path = "../sz-orm-masking", version = "5.0.0", optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lib]
name = "sz_orm_observability"
path = "src/lib.rs"

[lints]
workspace = true

[[test]]
name = "service_mesh_test"
required-features = ["service-mesh"]
