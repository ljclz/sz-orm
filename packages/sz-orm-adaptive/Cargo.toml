[package]
name = "sz-orm-adaptive"
description = "Adaptive query executor: runtime statistics collection with auto pagination / hot-cache / slow-query decisions"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.3.0 M4：自适应查询（统计采集 + 决策默认可用；结果缓存序列化由本 feature 启用）
adaptive-query = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

[lints]
workspace = true
