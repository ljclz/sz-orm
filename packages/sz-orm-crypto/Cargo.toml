[package]
name = "sz-orm-crypto"
version.workspace = true
edition.workspace = true
description = "SZ-ORM Crypto Extension - Encryption, password hashing, and API signing"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.9.0：OWASP Top 10 完整覆盖渗透测试套件（编译门控，默认关闭）
owasp-pentest-suite = []
# v6.7.0：密钥轮换零停机（双密钥共存）
field-encryption = []
# v7.0.0：TDE 透明数据加密增强（DEK 安全缓冲 + KMS 客户端 + 列级策略）
tde-enhanced = ["field-encryption", "dep:zeroize", "dep:async-trait", "dep:reqwest", "dep:parking_lot"]
# v7.8.0 量子安全准备：PQC 算法白名单 + trait 抽象 + 迁移评估
pqc-ready = ["dep:tracing"]
# v7.8.0 PQC 混合密钥协商
pqc-hybrid-kex = ["pqc-ready"]
# v7.9.0 PQC 迁移执行：渐进迁移 + 断点恢复 + 性能基准追踪 + 算法敏捷性
pqc-migration-exec = ["pqc-hybrid-kex"]
# v7.9.0 密钥轮换管理（依赖 pqc-migration-exec）
pqc-key-rotation = ["pqc-migration-exec"]
# v8.0.0：安全合规深化聚合（sec-compliance 启用全部子能力）
tde-key-mgmt = ["tde-enhanced"]
sec-compliance = ["tde-key-mgmt"]


key-auto-rotate = ["sec-compliance"]
[package.metadata.cargo-machete]
ignored = ['serde_json']

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = { workspace = true }
sha2 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["simple"] }
rand = "0.8"
subtle = "2.5"
# RSA-OAEP 非对称加密（任务要求，RustCrypto audited crate）
rsa = "0.9"
# v7.0.0 tde-enhanced 依赖
zeroize = { workspace = true, optional = true }
async-trait = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
parking_lot = { workspace = true, optional = true }
# v7.8.0 PQC 依赖
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
parking_lot = { workspace = true }
# v7.8.0 跨模块联动 e2e 测试
sz-orm-ai = { path = "../sz-orm-ai", features = ["ai-autonomous-loop"] }
# v8.0.0 安全合规深化 e2e 接线测试
sz-orm-audit = { path = "../sz-orm-audit", features = ["audit-evidence-chain"] }
sz-orm-masking = { path = "../sz-orm-masking", features = ["masking-policy-engine"] }
sz-orm-auth = { path = "../sz-orm-auth", features = ["auth-abac"] }

[lints]
workspace = true
# v7.8.0 PQC 端到端测试
[[test]]
name = "e2e_hybrid_handshake"
path = "tests/e2e_hybrid_handshake.rs"
required-features = ["pqc-hybrid-kex"]

[[test]]
name = "e2e_pqc_degrade"
path = "tests/e2e_pqc_degrade.rs"
required-features = ["pqc-hybrid-kex"]

[[test]]
name = "e2e_migration_assess"
path = "tests/e2e_migration_assess.rs"
required-features = ["pqc-ready"]

[[test]]
name = "e2e_whitelist_reject"
path = "tests/e2e_whitelist_reject.rs"
required-features = ["pqc-ready"]

[[test]]
name = "e2e_signature_latency"
path = "tests/e2e_signature_latency.rs"
required-features = ["pqc-hybrid-kex"]
# v7.8.0 跨模块联动 e2e 测试
[[test]]
name = "e2e_pqc_autonomous"
path = "tests/e2e_pqc_autonomous.rs"
required-features = ["pqc-hybrid-kex"]
# v7.9.0 PQC 迁移执行与密钥轮换端到端接线测试
[[test]]
name = "pqc_exec_wiring"
path = "tests/pqc_exec_wiring.rs"
required-features = ["pqc-key-rotation"]
# v8.0.0 安全合规深化端到端接线测试
[[test]]
name = "sec_compliance_wiring"
path = "tests/sec_compliance_wiring.rs"
required-features = ["sec-compliance"]
