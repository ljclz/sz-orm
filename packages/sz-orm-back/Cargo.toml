[package]
name = "sz-orm-back"
description = "Backup/restore: SQL dump/load, incremental backup, SHA-256 verification"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true


[package.metadata.cargo-machete]
ignored = ['async-trait', 'thiserror']
[dependencies]
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { workspace = true }
flate2 = "1.0"
sha2 = "0.10"
# 高级备份功能所需：zstd 压缩 + AES-GCM 加密（复用 sz-orm-crypto）
zstd = "0.13"
sz-orm-crypto = { version = "8.2.0", path = "../sz-orm-crypto" }

[features]
default = []
# v4.1.0：备份验证自动化（完整性校验 + 恢复演练 + 核验报告）
backup-verify = []

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true