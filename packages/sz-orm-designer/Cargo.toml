[package]
name = "sz-orm-designer"
description = "可视化 Schema 设计器：图形化建表/改表/ER 图编辑/双向代码生成"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
schema-designer = ["dep:axum", "dep:syn", "dep:quote", "dep:sz-orm-core", "dep:sz-orm-masking", "dep:tokio", "sz-orm-core/prod-dialect-security"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
axum = { version = "0.7", optional = true }
syn = { version = "2.0", features = ["full", "parsing"], optional = true }
quote = { version = "1.0", optional = true }
tokio = { workspace = true, optional = true }
sz-orm-core = { workspace = true, optional = true }
sz-orm-masking = { workspace = true, optional = true }

[lints]
workspace = true