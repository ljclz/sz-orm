[package]
name = "sz-orm-fusion"
description = "Multi-database fusion query POC: cache-key pushdown / search pushdown / primary fallback with degradation (experimental, not for production use)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.3.0 M5（可选实验）：多数据库融合查询 POC（查询拆分 + 聚合 + 降级）
db-fusion = ["dep:serde", "dep:serde_json"]
# v4.4.0 M3：db-fusion 转正（TTL 缓存 + 失效广播 + CDC 同步 + 向量下推）
db-fusion-v2 = ["db-fusion", "dep:sz-orm-core", "dep:sz-orm-queue", "sz-orm-queue/cdc", "dep:sz-orm-vector", "sz-orm-vector/hybrid-search", "dep:tokio", "dep:async-trait", "dep:futures"]
# v7.0.0：多区域多活（全局路由 + 容灾切换 + 复制延迟 + 边缘节点 + 冲突解决）
multi-region = ["db-fusion-v2", "dep:sz-orm-health", "dep:sz-orm-audit", "dep:sz-orm-config", "dep:sz-orm-rw", "sz-orm-rw/auto-failover", "dep:parking_lot", "dep:tracing"]


[package.metadata.cargo-machete]
ignored = ['serde']
[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sz-orm-core = { path = "../sz-orm-core", version = "7.0.0", optional = true }
sz-orm-queue = { path = "../sz-orm-queue", version = "7.0.0", optional = true }
sz-orm-vector = { path = "../sz-orm-vector", version = "7.0.0", optional = true }
tokio = { version = "1.40", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }
# v7.0.0 multi-region 依赖
sz-orm-health = { path = "../sz-orm-health", version = "7.0.0", optional = true }
sz-orm-audit = { path = "../sz-orm-audit", version = "7.0.0", optional = true }
sz-orm-config = { path = "../sz-orm-config", version = "7.0.0", optional = true }
sz-orm-rw = { path = "../sz-orm-rw", version = "7.0.0", optional = true }
parking_lot = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
