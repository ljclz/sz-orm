[package]
name = "sz-orm-fusion"
description = "Multi-database fusion query POC: cache-key pushdown / search pushdown / primary fallback with degradation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.3.0 M5（可选实验）：多数据库融合查询 POC（查询拆分 + 聚合 + 降级）
db-fusion = ["dep:serde", "dep:serde_json"]
# v4.4.0 M3：db-fusion 转正（TTL 缓存 + 失效广播 + CDC 同步 + 向量下推）
db-fusion-v2 = ["db-fusion", "dep:sz-orm-core", "dep:sz-orm-queue", "sz-orm-queue/cdc", "dep:sz-orm-vector", "sz-orm-vector/hybrid-search", "dep:tokio", "dep:async-trait", "dep:futures"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sz-orm-core = { path = "../sz-orm-core", version = "4.5.0", optional = true }
sz-orm-queue = { path = "../sz-orm-queue", version = "4.5.0", optional = true }
sz-orm-vector = { path = "../sz-orm-vector", version = "4.5.0", optional = true }
tokio = { version = "1.40", features = ["full"], optional = true }
async-trait = { version = "0.1", optional = true }
futures = { version = "0.3", optional = true }

[lints]
workspace = true
