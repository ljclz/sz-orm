[package]
name = "sz-orm-postgis"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SZ-ORM PostGIS Extension - PostgreSQL PostGIS spatial geometry queries"

[features]
default = []
real-postgis = ["tokio-postgres", "postgis"]

[dependencies]
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio-postgres = { version = "0.7", optional = true }
postgis = { version = "0.9", optional = true }
# 锁毒化修复：使用 parking_lot 替代 std::sync，消除 .lock().unwrap() panic 风险
parking_lot.workspace = true

[dev-dependencies]
tokio-test = "0.4"

[lints]
workspace = true
