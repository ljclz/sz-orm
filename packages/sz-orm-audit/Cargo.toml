[package]
name = "sz-orm-audit"
description = "SQL audit log: execution audit trail with case-insensitive sensitive-keyword masking (password/token/credit_card) and JSON flush"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.9.0：OWASP Top 10 完整覆盖渗透测试套件（编译门控，默认关闭）
owasp-pentest-suite = []
# v4.0.0 M4：数据 lineage（字段级血缘追踪 + 影响分析 + 溯源分析）
data-lineage = ["dep:sqlparser"]
# v4.1.0：数据质量自动检测（六类统计学规则 + 只读检测）
data-quality = []
# v4.3.0 M3：血缘可视化（Mermaid/HTML 导出）+ 带深度影响分析（复用 data-lineage 的 LineageGraph）
lineage-viz = ["data-lineage"]
# v6.7.0：审计日志链式哈希增强
hash-chain-enhanced = []
# v7.5.0：合规报告生成器（GDPR / SOX）
compliance-report = []
# v7.6.0：跨节点审计哈希链
cross-node-audit = ["hash-chain-enhanced"]
# v7.6.0：端到端血缘追踪
end-to-end-lineage = ["data-lineage"]
# v7.7.0 任务 4.2：合规自动检查
compliance-auto-check = ["compliance-report"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# #11 修复：审计日志哈希链防篡改（SHA-256 密码学哈希）
sha2 = { workspace = true }
# v4.0.0 M4：SQL 依赖解析（data-lineage feature）
sqlparser = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }

[lints]
workspace = true

[[test]]
name = "lineage_test"
required-features = ["data-lineage"]

[[test]]
name = "owasp_a07_integrity"
required-features = ["owasp-pentest-suite"]

[[test]]
name = "owasp_a08_logging_failures"
required-features = ["owasp-pentest-suite"]

[[test]]
name = "compliance_report_test"
required-features = ["compliance-report"]

[[test]]
name = "v760_cross_node_test"
required-features = ["cross-node-audit"]

[[test]]
name = "v760_pci_dss_iso27001_test"
required-features = ["compliance-report"]

[[test]]
name = "v760_end_to_end_lineage_test"
required-features = ["end-to-end-lineage"]
# v7.7.0 任务 4.6：合规自动检查端到端测试
[[test]]
name = "compliance_auto_check_test"
required-features = ["compliance-auto-check"]# v7.8.0 幻影交付修复 e2e 测试
[[test]]
name = "e2e_autonomous_audit"