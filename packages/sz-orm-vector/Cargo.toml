[package]
name = "sz-orm-vector"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "SZ-ORM pgvector Extension - Vector similarity search with pgvector"

[features]
default = []
real-pg = ["dep:tokio-postgres"]
# v4.0.0 M3：混合搜索（向量+全文+结构化三源融合 + RRF/加权/级联）
hybrid-search = []
# v6.8.0：Embedding 存储统一入口 + 降级处理
embedding-store = []
# v7.3.0 任务 3.5：ANN 加速检索 + 召回率指标 + 租户隔离
ann-accel = []


[package.metadata.cargo-machete]
ignored = ['serde', 'sz-orm-ai']
[dependencies]
async-trait = "0.1"
tokio = { version = "1.40", features = ["full"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sz-orm-ai = { workspace = true }
tokio-postgres = { version = "0.7", optional = true }

[dev-dependencies]
tokio-test = "0.4"

[[test]]
name = "vector_tests"
path = "tests/vector_tests.rs"

[[test]]
name = "vector_hybrid_wiring"
path = "tests/vector_hybrid_wiring.rs"
required-features = ["hybrid-search"]

[[test]]
name = "vector_search_wiring"
path = "tests/vector_search_wiring.rs"
required-features = ["embedding-store"]

[[test]]
name = "ann_accel"
path = "tests/ann_accel.rs"
required-features = ["ann-accel"]

[[test]]
name = "ann_e2e"
path = "tests/ann_e2e.rs"
required-features = ["ann-accel", "real-pg"]

[lints]
workspace = true
