[package]
name = "sz-orm-health"
description = "Health check & SLO alerting: pool status aggregation, p50/p95/p99 latency, failover policy, circuit breaker, multi-region view, alert channels (log/webhook/IM)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["prod-health-endpoint", "prod-probe-endpoint", "ha-events", "health-subitems"]
# v3.8.0：健康检查 HTTP 端点配置化
prod-health-endpoint = []
# v3.8.0：K8s readiness/liveness 探针端点
prod-probe-endpoint = []
# v7.3.0：高可用事件总线（HaEventBus/HaEvent/HaEventSubscriber）
ha-events = []
# v7.3.0：5 子项健康检查（HealthSubItem/HealthReportV2），依赖事件总线
health-subitems = ["ha-events"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { workspace = true }

[lints]
workspace = true
# v7.3.0 任务 2.1：HaEventBus 测试
[[test]]
name = "ha_event_bus"
path = "tests/ha_event_bus.rs"
required-features = ["ha-events"]

# v7.3.0 任务 2.5：5 子项健康检查测试
[[test]]
name = "health_subitems"
path = "tests/health_subitems.rs"
required-features = ["health-subitems"]
