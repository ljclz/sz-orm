[package]
name = "sz-orm-health"
description = "Health check & SLO alerting: pool status aggregation, p50/p95/p99 latency, failover policy, circuit breaker, multi-region view, alert channels (log/webhook/IM)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["prod-health-endpoint", "prod-probe-endpoint"]
# v3.8.0：健康检查 HTTP 端点配置化
prod-health-endpoint = []
# v3.8.0：K8s readiness/liveness 探针端点
prod-probe-endpoint = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { workspace = true }

[lints]
workspace = true
