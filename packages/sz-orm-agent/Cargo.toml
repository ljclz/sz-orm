[package]
name = "sz-orm-agent"
description = "AI Agent for autonomous database operations (perceive-decide-act loop)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
sz-orm-ai = { version = "5.1.0", path = "../sz-orm-ai", optional = true }
sz-orm-diagnosis = { version = "5.1.0", path = "../sz-orm-diagnosis", optional = true }
sz-orm-anomaly = { version = "5.1.0", path = "../sz-orm-anomaly", optional = true }
sz-orm-audit = { version = "5.1.0", path = "../sz-orm-audit", optional = true }
sz-orm-core = { version = "5.1.0", path = "../sz-orm-core", optional = true }
tokio = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

[features]
default = []
agent = [
    "dep:sz-orm-ai",
    "dep:sz-orm-diagnosis",
    "dep:sz-orm-anomaly",
    "dep:sz-orm-audit",
    "dep:sz-orm-core",
    "dep:tokio",
    "dep:async-trait",
    "dep:serde",
    "dep:serde_json",
    "dep:tracing",
    "dep:chrono",
    "dep:parking_lot",
    "dep:sha2",
    "dep:futures",
    "sz-orm-ai/multi-llm",
    "sz-orm-ai/ai-security-audit",
]
agent-react = ["agent"]
agent-plan-execute = ["agent"]
agent-workflow = ["agent"]

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
sz-orm-sqlx = { version = "5.1.0", path = "../sz-orm-sqlx" }

[lints]
workspace = true

[[test]]
name = "perception_loop"
path = "tests/perception_loop.rs"
required-features = ["agent"]

[[test]]
name = "tool_registry"
path = "tests/tool_registry.rs"
required-features = ["agent"]

[[test]]
name = "tool_audit"
path = "tests/tool_audit.rs"
required-features = ["agent"]

[[test]]
name = "approval_gate"
path = "tests/approval_gate.rs"
required-features = ["agent"]

[[test]]
name = "permission_guard"
path = "tests/permission_guard.rs"
required-features = ["agent"]

[[test]]
name = "checkpoint_resume"
path = "tests/checkpoint_resume.rs"
required-features = ["agent"]

[[test]]
name = "react_planner"
path = "tests/react_planner.rs"
required-features = ["agent"]

[[test]]
name = "plan_execute_planner"
path = "tests/plan_execute_planner.rs"
required-features = ["agent"]

[[test]]
name = "workflow"
path = "tests/workflow.rs"
required-features = ["agent"]

[[test]]
name = "llm_fallback"
path = "tests/llm_fallback.rs"
required-features = ["agent"]

[[test]]
name = "trace_export"
path = "tests/trace_export.rs"
required-features = ["agent"]

[[test]]
name = "tool_mysql"
path = "tests/tool_mysql.rs"
required-features = ["agent"]