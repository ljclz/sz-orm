[package]
name = "sz-orm-diagnosis"
description = "Slow query auto-diagnosis: phase-based bottleneck localization with root-cause analysis and fix suggestions (internal tool, not for external use)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.4.0 M2：慢查询自动诊断报告（分阶段瓶颈定位 + 根因分析 + 修复建议）
# 注：不依赖 sz-orm-advisor，避免循环依赖。建议联动在 sz-orm-advisor 闭环中串联。
slow-query-diagnosis = ["dep:serde", "dep:serde_json", "dep:sz-orm-flamegraph", "dep:sz-orm-adaptive"]
# v5.1.0：LLM 驱动故障诊断（需传入 LlmRouter，未启用时零编译开销）
llm-diagnosis = ["slow-query-diagnosis", "dep:sz-orm-ai", "sz-orm-ai/multi-llm", "dep:thiserror", "dep:tracing"]
# v5.1.0 P2：故障预测器（基于性能指标时序数据预测未来故障）
failure-prediction = ["dep:serde", "dep:serde_json"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sz-orm-flamegraph = { path = "../sz-orm-flamegraph", version = "6.0.0", optional = true }
sz-orm-adaptive = { path = "../sz-orm-adaptive", version = "6.0.0", optional = true }
sz-orm-ai = { path = "../sz-orm-ai", version = "6.0.0", optional = true }
thiserror = { version = "2.0", optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true

[[test]]
name = "llm_diagnoser_test"
path = "tests/llm_diagnoser_test.rs"
required-features = ["llm-diagnosis"]

[[test]]
name = "failure_predictor_test"
path = "tests/failure_predictor_test.rs"
required-features = ["failure-prediction"]
