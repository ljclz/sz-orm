[package]
name = "sz-orm-diagnosis"
description = "Slow query auto-diagnosis: phase-based bottleneck localization with root-cause analysis and fix suggestions (internal tool, not for external use)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.4.0 M2：慢查询自动诊断报告
slow-query-diagnosis = ["dep:serde", "dep:serde_json", "dep:sz-orm-flamegraph", "dep:sz-orm-adaptive"]
# v5.1.0：LLM 驱动故障诊断
llm-diagnosis = ["slow-query-diagnosis", "dep:sz-orm-ai", "sz-orm-ai/multi-llm", "dep:thiserror", "dep:tracing"]
# v5.1.0 P2：故障预测器
failure-prediction = ["dep:serde", "dep:serde_json"]
# v6.8.0：自动诊断 Hook
auto-diagnose = ["slow-query-diagnosis"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
sz-orm-flamegraph = { path = "../sz-orm-flamegraph", version = "7.1.0", optional = true }
sz-orm-adaptive = { path = "../sz-orm-adaptive", version = "7.1.0", optional = true }
sz-orm-ai = { path = "../sz-orm-ai", version = "7.1.0", optional = true }
thiserror = { version = "2.0", optional = true }
tracing = { workspace = true, optional = true }
parking_lot = { workspace = true }

[lints]
workspace = true

[[test]]
name = "llm_diagnoser_test"
path = "tests/llm_diagnoser_test.rs"
required-features = ["llm-diagnosis"]

[[test]]
name = "failure_predictor_test"
path = "tests/failure_predictor_test.rs"
required-features = ["failure-prediction"]

[[test]]
name = "auto_diagnose_wiring"
path = "tests/auto_diagnose_wiring.rs"
required-features = ["auto-diagnose"]
