[package]
name = "sz-orm-core"
description = "Core ORM engine: Model trait, ActiveRecord, QueryBuilder, Pool, Transaction, migration, and SQL dialect abstraction"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# 默认启用 Redis 分布式缓存后端（RedisBackend），开箱即�?
default = ["redis"]
testing = ["tokio/full"]
# 启用 query! 宏的编译期连真实 DB 验证能力（转发至 sz-orm-macros/db-verify�?
db-verify = ["sz-orm-macros/db-verify"]
# 启用 L2Cache �?Redis 分布式后端（Fix #39：真实实现，基于 redis 0.27 + tokio-comp + connection-manager�?
redis = ["dep:redis"]
# #88 修复：断路器�?ORM 执行路径集成（引�?sz-orm-health �?CircuitBreaker�?
circuit-breaker = ["sz-orm-health"]
# #93 修复：限流器�?ORM 执行路径集成（引�?sz-orm-limit �?RateLimiter�?
rate-limit = ["sz-orm-limit"]
# v3.2.0：连接池自动预热增强（渐进式分批 + 多池统一 + 进度可观测）
auto-prewarm = []
# v3.2.0：查询计划缓存（SQL 解析/优化结果缓存 + LRU 淘汰 + 表级失效�?
plan-cache = ["dep:sqlparser", "dep:xxhash-rust"]
# v3.2.0：零拷贝序列化（BorrowedValue + ColumnarResultSet�?
zero-copy = []
# v3.2.0：SIMD 加速（批量整数解码 + 列比�?+ 自动降级�?
simd = ["dep:wide"]
# v3.3.0：多租户与数据隔离增强（租户上下文自动注�?+ Schema 隔离 + 连接池隔�?+ 行级安全 + 列级脱敏 + 多租户审计）
multi-tenant-enhanced = ["dep:sz-orm-audit", "dep:sz-orm-masking"]
# v3.3.0：分布式缓存一致性（跨实例失�?+ Write-behind + 缓存击穿/雪崩防护�?
dist-cache = ["dep:bloomfilter", "dep:rand", "dep:sz-orm-crypto"]
# v3.4.0：测试覆盖补齐门禁矩阵标识（不引入依赖，仅用�?feature 组合编译门禁�?
test-coverage = []
# v3.4.0：架构改进门禁矩阵标识（不引入依赖，仅用�?feature 组合编译门禁�?
arch-improvement = []
# v3.4.0：文档补全门禁矩阵标识（不引入依赖，仅用�?feature 组合编译门禁�?
doc-completion = []
# v3.4.0：SmallString 优化（CompactString 替代 String，短字符�?�?23 字节内联存储�?
perf-smallstring = ["dep:compact_str"]
# v3.4.0：enum dispatch 优化（match 分发替代 Box<dyn Dialect> vtable 查找�?
perf-enum-dispatch = []
# v3.4.0：L2 缓存零拷贝推广（BorrowedValue + ColumnarResultSet 推广�?L2 缓存路径�?
perf-zero-copy-l2 = ["zero-copy"]
# v3.4.0：Box<str> 优化（Value::BoxedStr 变体，节�?8 字节/�?capacity 字段�?
perf-box-str = []
# v3.4.0：类型安全列引用（Column<T> + Schema derive 列名常量�?
type-safe-columns = ["sz-orm-macros/type-safe-columns"]
# v3.4.0：类型化列（Column<T> 独立 feature，允许仅启用 Column<T> 不启�?Schema 扩展�?
typed-column = []
# v3.4.0：类型化 DSL（typed_ast.rs Diesel 风格表达�?DSL�?
typed-dsl = []
# v3.7.0: stable（类型安全关联查询，编译期外键校验）
typed-relation = []
# v3.7.0: stable（proc-macro 编译�?SQL 验证�?
sql-verify-proc = ["dep:sqlparser", "dep:xxhash-rust"]
# v3.6.0：QueryBuilder 迁移工具（lint + fix + 差分测试�?
qb-migration-tool = ["dep:syn", "dep:quote"]
# v3.5.0：L1 缓存（Session 级别 Identity Map + LRU + AtomicU64 统计�?
l1-cache = []
# v3.5.0：CockroachDB 方言（PG 兼容分布式数据库，委�?PostgreSqlDialect�?
dialect-cockroachdb = []
# v3.5.0：YugabyteDB 方言（PG 兼容分布式数据库，委�?PostgreSqlDialect�?
dialect-yugabytedb = []
# v3.6.0：Snowflake 方言（云数仓，独立实现，支持 VARIANT/OBJECT/ARRAY + COPY INTO + TIME TRAVEL�?
dialect-snowflake = []
# v3.6.0：Redshift 方言（AWS 云数仓，委派 PostgreSqlDialect + COPY/UNLOAD 特性扩展）
dialect-redshift = []
# v3.7.0: Informix 方言（SQL generation only，SERIAL/ROW 类型 + PUT 语句，无�?DB 驱动�?
dialect-informix = []
# v3.7.0: SAP HANA 方言（SQL generation only，计算列 + CE 函数，无�?DB 驱动�?
dialect-saphana = []
# v3.7.0: Firebird 方言（SQL generation only，GENERATOR/SEQUENCE + EXECUTE BLOCK，无�?DB 驱动�?
dialect-firebird = []
# v3.4.0：迁移指南门禁矩阵标识（纯文档，不引入依赖）
migration-guide = []
# v3.7.0：真�?DB 端到端测试套件（连真�?MySQL/PostgreSQL/SQLite/Oracle/MSSQL 验证 8 类核心路径）
e2e-real-db = []
# v3.8.0：生产部署就绪检查清单（prod-ready feature gate 体系�?4 个子 feature，默认关闭）
# 注意：跨�?feature 在各自包中独立定义，sz-orm-core 仅聚合自身内�?feature
prod-redis-tls = []
prod-jwt-key-rotation = []
prod-metrics-acl = []
prod-shutdown-timeout = []
prod-leak-detection = []
prod-n1-tuning = []
prod-pool-tuning = []
prod-config-masking = []
prod-log-level = []
prod-health-endpoint = []
prod-probe-endpoint = []
prod-circuit-tuning = []
prod-rate-limit-tuning = []
prod-dialect-security = []
# prod-ready �?feature：聚合所有生产就绪子 feature
prod-ready = [
    "prod-redis-tls",
    "prod-jwt-key-rotation",
    "prod-metrics-acl",
    "prod-shutdown-timeout",
    "prod-leak-detection",
    "prod-n1-tuning",
    "prod-pool-tuning",
    "prod-config-masking",
    "prod-log-level",
    "prod-health-endpoint",
    "prod-probe-endpoint",
    "prod-circuit-tuning",
    "prod-rate-limit-tuning",
    "prod-dialect-security",
]
# v3.9.0：benchmark 套件 + 数据验证 + 迁移 dry-run + 流式导出（feature gate 隔离，默认关闭）
benchmark-suite = ["dep:criterion"]
data-validation = ["sz-orm-macros/data-validation", "dep:regex"]
validate-on-write = ["data-validation"]
migration-dry-run = ["dep:regex"]
streaming-export = ["dep:csv"]

[dependencies]
async-trait.workspace = true
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
# P3-4 修复：使�?parking_lot::RwLock 替换 std::sync::RwLock，消除锁毒化风险
# parking_lot �?RwLock 不会返回 PoisonError，无需 unwrap()，且性能更好
parking_lot.workspace = true
# v1.1.0 优化 2：Pool 无锁队列（crossbeam-queue::ArrayQueue 替换 Mutex<VecDeque>�?
crossbeam-queue.workspace = true
# 流式查询：Connection::query_stream 默认实现需�?futures::stream::empty
futures.workspace = true
sz-orm-sql-validator = { version = "4.0.0", path = "../sz-orm-sql-validator" }
sz-orm-macros = { version = "4.0.0", path = "../sz-orm-macros" }
# #88 修复：可选断路器依赖（启�?circuit-breaker feature 时生效）
sz-orm-health = { version = "4.0.0", path = "../sz-orm-health", optional = true }
# #93 修复：可选限流器依赖（启�?rate-limit feature 时生效）
sz-orm-limit = { version = "4.0.0", path = "../sz-orm-limit", optional = true }
# Fix #39：L2Cache RedisBackend 真实实现（启�?redis feature 时生效）
# 使用 connection-manager 自动重连 + tokio-comp 异步 IO
redis = { workspace = true, optional = true }
# v3.2.0：查询计划缓存（plan-cache feature�?
sqlparser = { workspace = true, optional = true }
xxhash-rust = { workspace = true, optional = true }
# v3.2.0：SIMD 加速（simd feature�?
wide = { workspace = true, optional = true }
# v3.3.0：多租户审计增强（multi-tenant-enhanced feature�?
sz-orm-audit = { version = "4.0.0", path = "../sz-orm-audit", optional = true }
# v3.3.0：列级脱敏增强（multi-tenant-enhanced feature�?
sz-orm-masking = { version = "4.0.0", path = "../sz-orm-masking", optional = true }
# v3.3.0：分布式缓存布隆过滤器防护（dist-cache feature�?
bloomfilter = { workspace = true, optional = true }
# v3.3.0：分布式缓存随机 TTL 雪崩防护（dist-cache feature�?
rand = { workspace = true, optional = true }
# v3.3.0：WAL 加密（dist-cache feature�?
sz-orm-crypto = { version = "4.0.0", path = "../sz-orm-crypto", optional = true }
# v3.4.0：SmallString 优化（perf-smallstring feature�?
compact_str = { workspace = true, optional = true }
# v3.6.0：QueryBuilder 迁移工具（qb-migration-tool feature�?
syn = { version = "2.0", features = ["full", "parsing", "visit"], optional = true }
quote = { version = "1.0", default-features = false, optional = true }
# v3.9.0：数据验�?+ 迁移 dry-run + 流式导出 + benchmark（feature gate 隔离�?
regex = { version = "1", optional = true }
csv = { version = "1.3", optional = true }

criterion = { version = "0.5", features = ["html_reports", "async_tokio"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }

# M3-T3: 差分测试需�?sz-orm-query-builder
sz-orm-query-builder = { path = "../sz-orm-query-builder" }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "chrono", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# DuckDB 真实集成测试（bundled：编�?DuckDB 源码，需 MSVC + CMake�?
duckdb = { version = "1", features = ["bundled"] }
oracle = { version = "0.6", default-features = false, features = ["chrono"] }
# v2.0.0 任务 1.2：SQL Server 真实集成测试（tiberius 0.12 异步驱动�?
# 仅启�?tds73 + chrono，不启用 TLS（本地开发环境；生产环境应启�?rustls �?native-tls�?
tiberius = { version = "0.12", default-features = false, features = ["tds73", "chrono"] }
# tiberius 0.12 需�?tokio-util compat 适配 tokio TcpStream
tokio-util = { version = "0.7", features = ["compat"] }
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
