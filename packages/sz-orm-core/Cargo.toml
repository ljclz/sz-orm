[package]
name = "sz-orm-core"
description = "Core ORM engine: Model trait, ActiveRecord, QueryBuilder, Pool, Transaction, migration, and SQL dialect abstraction"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# 默认启用 Redis 分布式缓存后端（RedisBackend），开箱即用
default = ["redis", "simd", "l1-cache", "plan-cache", "zero-copy", "auto-prewarm", "perf-zero-copy-l2", "perf-enum-dispatch", "perf-box-str", "dialect-cockroachdb", "dialect-yugabytedb", "dialect-snowflake", "dialect-redshift", "dialect-informix", "dialect-saphana", "dialect-firebird", "prod-redis-tls", "prod-jwt-key-rotation", "prod-metrics-acl", "prod-shutdown-timeout", "prod-leak-detection", "prod-n1-tuning", "prod-pool-tuning", "prod-config-masking", "prod-log-level", "prod-health-endpoint", "prod-probe-endpoint", "prod-circuit-tuning", "prod-rate-limit-tuning", "prod-dialect-security", "cache-coherence", "performance", "prepared-stmt-cache", "async-row-stream", "query-result-cache", "saga-tx", "multi-tenant-pool", "perf-accel"]
# v4.9.0：OWASP Top 10 完整覆盖渗透测试套件（编译门控，默认关闭）
owasp-pentest-suite = []
testing = ["tokio/full"]
# 启用 query! 宏的编译期连真实 DB 验证能力（转发至 sz-orm-macros/db-verify）
db-verify = ["sz-orm-macros/db-verify"]
# 启用 L2Cache 与 Redis 分布式后端（Fix #39：真实实现，基于 redis 0.27 + tokio-comp + connection-manager）
redis = ["dep:redis"]
# #88 修复：断路器与 ORM 执行路径集成（引入 sz-orm-health 与 CircuitBreaker）
circuit-breaker = ["sz-orm-health"]
# #93 修复：限流器与 ORM 执行路径集成（引入 sz-orm-limit 与 RateLimiter）
rate-limit = ["sz-orm-limit"]
# v3.2.0：连接池自动预热增强（渐进式分批 + 多池统一 + 进度可观测）
auto-prewarm = []
# v3.2.0：查询计划缓存（SQL 解析/优化结果缓存 + LRU 淘汰 + 表级失效）
plan-cache = ["dep:sqlparser", "dep:twox-hash"]
# v3.2.0：零拷贝序列化（BorrowedValue + ColumnarResultSet）
zero-copy = []
# v3.2.0：SIMD 加速（批量整数解码 + 列比较 + 自动降级）
simd = []
# v6.8.0：SIMD 向量化聚合深度
simd-deep = []
# v3.3.0：多租户与数据隔离增强（租户上下文自动注入 + Schema 隔离 + 连接池隔离 + 行级安全 + 列级脱敏 + 多租户审计）
multi-tenant-enhanced = ["dep:sz-orm-audit", "dep:sz-orm-masking"]
# v3.3.0：分布式缓存一致性（跨实例失效 + Write-behind + 缓存击穿/雪崩防护）
dist-cache = ["dep:rand", "dep:sz-orm-crypto"]
# v3.4.0：SmallString 优化（CompactString 替代 String，短字符串 ≤23 字节内联存储）
perf-smallstring = ["dep:compact_str"]
perf-zero-copy-l2 = []
# v3.4.0：enum dispatch 优化（match 分发替代 Box<dyn Dialect> vtable 查找）
perf-enum-dispatch = []

perf-box-str = []
# v3.4.0：类型安全列引用（Column<T> + Schema derive 列名常量）
type-safe-columns = ["sz-orm-macros/type-safe-columns"]
# v3.4.0：类型化列（Column<T> 独立 feature，允许仅启用 Column<T> 不启用 Schema 扩展）

# v3.4.0：类型化 DSL（typed_ast.rs Diesel 风格表达式 DSL）
typed-dsl = []
# v3.7.0: stable（类型安全关联查询，编译期外键校验）
typed-relation = []
# v3.7.0: stable（proc-macro 编译期 SQL 验证）
sql-verify-proc = ["dep:sqlparser", "dep:twox-hash"]
# v3.6.0：QueryBuilder 迁移工具（lint + fix + 差分测试）
qb-migration-tool = ["dep:syn", "dep:quote"]
# v3.5.0：L1 缓存（Session 级别 Identity Map + LRU + AtomicU64 统计）
l1-cache = []
# v3.5.0：CockroachDB 方言（PG 兼容分布式数据库，委托 PostgreSqlDialect）
dialect-cockroachdb = []
# v3.5.0：YugabyteDB 方言（PG 兼容分布式数据库，委托 PostgreSqlDialect）
dialect-yugabytedb = []
# v3.6.0：Snowflake 方言（云数仓，独立实现，支持 VARIANT/OBJECT/ARRAY + COPY INTO + TIME TRAVEL）
dialect-snowflake = []
# v3.6.0：Redshift 方言（AWS 云数仓，委派 PostgreSqlDialect + COPY/UNLOAD 特性扩展）
dialect-redshift = []
# v3.7.0: Informix 方言（SQL generation only，SERIAL/ROW 类型 + PUT 语句，无独立 DB 驱动）
dialect-informix = []
# v3.7.0: SAP HANA 方言（SQL generation only，计算列 + CE 函数，无独立 DB 驱动）
dialect-saphana = []
# v3.7.0: Firebird 方言（SQL generation only，GENERATOR/SEQUENCE + EXECUTE BLOCK，无独立 DB 驱动）
dialect-firebird = []
# v3.7.0：真实 DB 端到端测试套件（连接 MySQL/PostgreSQL/SQLite/Oracle/MSSQL 验证 8 类核心路径）
e2e-real-db = []
# v3.8.0：生产部署就绪检查清单（prod-ready feature gate 体系：4 个子 feature，默认关闭）
# 注意：跨包 feature 在各自包中独立定义，sz-orm-core 仅聚合自身内部 feature
prod-redis-tls = []
prod-jwt-key-rotation = []
prod-metrics-acl = []
prod-shutdown-timeout = []
prod-leak-detection = []
prod-n1-tuning = []
prod-pool-tuning = []
prod-config-masking = []
prod-log-level = []
prod-health-endpoint = []
prod-probe-endpoint = []
prod-circuit-tuning = []
prod-rate-limit-tuning = []
prod-dialect-security = []
# prod-ready 体系 feature：聚合所有生产就绪子 feature
prod-ready = [
    "prod-redis-tls",
    "prod-jwt-key-rotation",
    "prod-metrics-acl",
    "prod-shutdown-timeout",
    "prod-leak-detection",
    "prod-n1-tuning",
    "prod-pool-tuning",
    "prod-config-masking",
    "prod-log-level",
    "prod-health-endpoint",
    "prod-probe-endpoint",
    "prod-circuit-tuning",
    "prod-rate-limit-tuning",
    "prod-dialect-security",
]
# v3.9.0：benchmark 套件 + 数据验证 + 迁移 dry-run + 流式导出（feature gate 隔离，默认关闭）
benchmark-suite = ["dep:criterion"]
bench-seaorm = ["dep:sea-orm"]
data-validation = ["sz-orm-macros/data-validation", "dep:regex"]
validate-on-write = ["data-validation"]
migration-dry-run = ["dep:regex"]
streaming-export = ["dep:csv"]
# v4.1.0：数据 seeding/fixture 管理 + schema diff 可视化（feature gate 隔离，默认关闭）
data-seeding = ["dep:rand", "dep:serde_yaml"]
schema-diff-viz = []
# v4.1.0：缓存一致性协议（MESI 状态机 + 失效广播 + Write-through/behind）
cache-coherence = []
# v4.1.0：迁移版本分支（多分支并行开发 + 合并冲突检测）
migration-branch = []
# v4.3.0 M3：编译期数据治理（PII 标注强制 + 合规报告，feature gate 隔离，默认关闭）
compile-governance = ["sz-orm-macros/governance-derive"]
# v4.3.0 M2：N+1 静态检测标注宏（#[detect_n_plus_one]，feature gate 隔离，默认关闭）
n1-lint = ["sz-orm-macros/n1-lint"]
# v4.6.0 M2：迁移回滚自动化（零停机 + 影子表 + 反向 DDL + 健康检查）
zero-downtime-rollback = []
# v4.6.0 M4：连接级多租户隔离（TenantPoolRegistry + 连接池级隔离）
connection-level-tenant = ["multi-tenant-enhanced"]

# v4.7.0 M2：迁移前向兼容性检查与沙箱预演（前向兼容 + 影子表预演 + 依赖图分析）
forward-compat-sandbox = ["zero-downtime-rollback", "migration-dry-run"]
# v4.7.0 M4：租户资源配额与行级安全增强（配额 + RLS 自动注入 + 租户审计）
tenant-quota-rls-enhanced = ["connection-level-tenant"]

# v4.9.0 TASK-004：异常检测（指标采集 + 滑动窗口 + 突增/耗尽检测 + 告警 + 报告）
anomaly-detection = ["dep:sz-orm-anomaly"]
# v4.9.1：性能优化组合（一键启用 SIMD 向量化 + L1 缓存 + 查询计划缓存 + 零拷贝）
performance = ["simd", "l1-cache", "plan-cache", "zero-copy"]
# v5.0.0：图数据库适配层（接入 sz-orm-graph InMemoryGraphEngine，提供 graph_query/graph_add_node/graph_add_relationship 入口）
graph = ["dep:sz-orm-graph"]
# v5.0.0：自适应查询适配层（接入 sz-orm-adaptive AdaptiveExecutor，提供 adaptive_decide/adaptive_record/adaptive_decision_count 入口）
adaptive-query = ["dep:sz-orm-adaptive"]
# v5.0.0：分布式追踪适配层（接入 sz-orm-tracing SzTracer，提供 tracing_start_span/tracing_end_span/tracing_span_count 入口）
distributed-tracing = ["dep:sz-orm-tracing"]
# v5.0.0 M4：P1 整包接入 core
graphql = ["dep:sz-orm-graphql"]
structured-logging = ["dep:sz-orm-logger"]
postgis = ["dep:sz-orm-postgis"]
timeseries = ["dep:sz-orm-timeseries"]
search = ["dep:sz-orm-search"]
read-write-splitting = ["dep:sz-orm-rw"]
config-center = ["dep:sz-orm-config"]

# v6.5.0：查询计划缓存（PreparedStatementCache，按连接分桶 + LRU + 表级失效）
prepared-stmt-cache = []
# v6.5.0：异步流式结果集（AsyncRowStream trait + CursorRowStream 降级）
async-row-stream = []
# v6.5.0：批量 DML 并行化（execute_batch_parallel，tokio 已是非 optional 依赖）
parallel-batch = []
# v6.6.0：查询结果缓存（QueryResultCache，TTL + LRU + 表级失效 + 统计）
query-result-cache = []
# v7.7.0：缓存命中率优化（智能预加载 + 热点识别 + 失效策略优化）
cache-hit-optimize = []
# v7.7.0 任务 4.3：绑定层性能对齐
binding-perf-align = []
# v6.6.0：Saga 分布式事务（正向执行 + 补偿编排 + 超时）
saga-tx = []
# v6.6.0：多租户5连接池隔离（按租户隔离 + 动态扩缩容 + 配额限制）
multi-tenant-pool = []
# v6.7.0：分布式缓存集群（一致性哈希 + 故障转移 + 击穿/穿透/雪崩防护）
dist-cache-cluster = ["dist-cache", "l1-cache"]
# v7.6.0：分布式缓存集群增强（一致性哈希虚拟节点 ≥ 150 + 数据迁移 ≤ 1/N + 故障转移 ≤ 3s）
dist-cache-enhanced = ["dist-cache-cluster"]
# v6.7.0：读写分离/分库分表增强（权重路由 + 延迟回退 + 分片键推断 + 跨片聚合）
rw-split-enhanced = ["dep:rand"]
# v6.7.0：零停机迁移（expand-contract + 回滚自动化 + 预演 + 兼容性检查）
zero-downtime-mig = []
# v6.7.0：连接池弹性（动态扩缩容 + 健康检查 + 多级熔断 + 预热）
pool-elastic = ["circuit-breaker", "auto-prewarm"]
# v6.7.0：可观测性增强（慢查询 Top-N + 执行计划回归 + Prometheus + 告警）
obs-enhanced = []
# v6.7.0：Prometheus 指标导出
prometheus-exporter = []
# v6.7.0：字段级加密（AES-GCM + 密钥轮换）
field-encryption = ["dep:sz-orm-crypto"]
# v6.7.0：RBAC 增强（角色继承 + 权限组合）
rbac-enhanced = []
# v6.7.0：动态脱敏（规则引擎 + 上下文感知）
dynamic-masking = []
# v6.7.0：合规报告（审计链式哈希 + 合规检查 + 报告生成）
compliance-report = []
# v6.8.0：零拷贝结果集传输深化（Bytes 引用计数切片 + 命中/回退统计）
zero-copy-deep = ["zero-copy"]
# v6.8.0：性能差分正确性测试套件（零拷贝 vs 拷贝、SIMD vs 标量结果一致性）
perf-diff = ["zero-copy-deep", "simd"]
# v6.8.0：CDC MySQL Binlog 变更捕获
cdc-mysql = ["dep:sqlx", "dist-cache-cluster", "dep:sz-orm-masking", "dep:sz-orm-search"]
# v6.8.0：CDC PostgreSQL WAL 变更捕获
cdc-postgres = ["dep:sqlx"]
# v6.8.0：CDC SQLite update-hook 变更捕获
cdc-sqlite = ["dep:sqlx"]
# v6.8.0：执行器优化（谓词下推 + 投影裁剪）
executor-opt = ["dep:sqlparser"]
# v6.8.0：连接池 IO 复用（PreparedStatement 通道复用）
pool-io-reuse = ["prepared-stmt-cache", "pool-elastic"]
# v6.8.0：io_uring 集成评估与降级（默认关闭，非 Linux 自动降级 tokio + 零拷贝深化）
io-uring = ["zero-copy-deep"]
# v7.0.0：TDE 透明加密拦截器（挂钩 before_insert/before_update/after_select）
tde-interceptor = ["field-encryption", "dep:sz-orm-crypto", "sz-orm-crypto/tde-enhanced"]
# v7.0.0：Serverless 适配（冷启动优化 + 优雅缩容 + 请求驱动扩容）
serverless-adapt = ["pool-elastic", "auto-prewarm"]
# v7.0.0：可组合性插件系统（panic 安全注册表 + 签名验证 + 中间件链 + 扩展点）
composable-plugin = ["dep:sz-orm-crypto"]
# v7.1.0：CDC 实时数据同步（Kafka Sink + Schema 变更适配 + 快照模式）
cdc-realtime-sync = []
# v7.1.0：RBAC + ABAC 权限模型增强（行级过滤 + 列级脱敏拦截器）
rbac-abac-enhanced = ["multi-tenant-enhanced"]
# v7.1.0：OLAP 向量化分析查询（聚合下推 + Star Schema 优化 + 物化视图匹配）
olap-vectorized = ["zero-copy", "simd", "executor-opt", "query-result-cache", "rw-split-enhanced"]
# v7.3.0：性能加速聚合 feature gate（SIMD + 零拷贝 + 预热 + 计划缓存，默认不启用）
perf-accel = ["simd", "zero-copy", "auto-prewarm", "plan-cache", "zero-copy-deep"]
# v7.3.0：自动主备故障转移（默认关闭，不改变单库行为）
auto-failover = ["rw-split-enhanced"]
# v7.3.0 任务 4.1：生态扩展配置聚合（EcoConfig，默认关闭）
eco-config = []
# v8.0.0：性能极致优化聚合
perf-extreme = ["perf-accel"]
pool-zero-copy = ["perf-extreme"]
query-simd = ["perf-extreme", "simd"]
serde-zero-copy = ["perf-extreme", "zero-copy"]
# v8.0.0：分布式缓存强一致
dist-cache-coherent = ["dist-cache", "cache-coherence"]
# v8.0.0：插件市场
plugin-marketplace = ["composable-plugin"]


eco-deep = ["plugin-marketplace-ops", "sdk-auto-gen"]
plugin-marketplace-ops = ["plugin-marketplace"]
sdk-auto-gen = []
[dependencies]
async-trait.workspace = true
sea-orm = { version = "1.1", optional = true }
tracing.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
# P3-4 修复：使用 parking_lot::RwLock 替换 std::sync::RwLock，消除锁毒化风险
# parking_lot 的 RwLock 不会返回 PoisonError，无需 unwrap()，且性能更好
parking_lot.workspace = true
# v1.1.0 优化 2：Pool 无锁队列（crossbeam-queue::ArrayQueue 替换 Mutex<VecDeque>）
crossbeam-queue.workspace = true
# 流式查询：Connection::query_stream 默认实现需要 futures::stream::empty
futures.workspace = true
sz-orm-sql-validator = { version = "8.2.0", path = "../sz-orm-sql-validator" }
sz-orm-macros = { version = "8.2.0", path = "../sz-orm-macros" }
# #88 修复：可选断路器依赖（启用 circuit-breaker feature 时生效）
sz-orm-health = { version = "8.2.0", path = "../sz-orm-health", optional = true }
# #93 修复：可选限流器依赖（启用 rate-limit feature 时生效）
sz-orm-limit = { version = "8.2.0", path = "../sz-orm-limit", optional = true }
# Fix #39：L2Cache RedisBackend 真实实现（启用 redis feature 时生效）
# 使用 connection-manager 自动重连 + tokio-comp 异步 IO
redis = { workspace = true, optional = true }
# v3.2.0：查询计划缓存（plan-cache feature）
sqlparser = { workspace = true, optional = true }
twox-hash = { workspace = true, optional = true }

# v3.3.0：多租户审计增强（multi-tenant-enhanced feature）
sz-orm-audit = { version = "8.2.0", path = "../sz-orm-audit", optional = true }
# v3.3.0：列级脱敏增强（multi-tenant-enhanced feature）
sz-orm-masking = { version = "8.2.0", path = "../sz-orm-masking", optional = true }
# v3.3.0：分布式缓存布隆过滤器防护（dist-cache feature）
# v3.3.0：分布式缓存随机 TTL 雪崩防护（dist-cache feature）
rand = { workspace = true, optional = true }
# v3.3.0：WAL 加密（dist-cache feature）
sz-orm-crypto = { version = "8.2.0", path = "../sz-orm-crypto", optional = true }

# v3.4.0：SmallString 优化（perf-smallstring feature）
compact_str = { workspace = true, optional = true }
# v3.6.0：QueryBuilder 迁移工具（qb-migration-tool feature）
syn = { version = "2.0", features = ["full", "parsing", "visit"], optional = true }
quote = { version = "1.0", default-features = false, optional = true }
# v3.9.0：数据验证 + 迁移 dry-run + 流式导出 + benchmark（feature gate 隔离）
regex = { version = "1", optional = true }
csv = { version = "1.3", optional = true }
# v4.1.0：数据 seeding/fixture 管理（data-seeding feature）
serde_yaml = { workspace = true, optional = true }

criterion = { version = "0.5", features = ["html_reports", "async_tokio"], optional = true }
# v4.9.0 TASK-004：异常检测模块（anomaly-detection feature）
sz-orm-anomaly = { version = "8.2.0", path = "../sz-orm-anomaly", optional = true }
# v5.0.0：图数据库适配层（graph feature）
sz-orm-graph = { version = "8.2.0", path = "../sz-orm-graph", optional = true }
# v5.0.0：自适应查询适配层（adaptive-query feature）
sz-orm-adaptive = { version = "8.2.0", path = "../sz-orm-adaptive", optional = true }
# v5.0.0：分布式追踪适配层（distributed-tracing feature）
sz-orm-tracing = { version = "8.2.0", path = "../sz-orm-tracing", optional = true }
# v5.0.0 M4：P1 整包适配层
sz-orm-graphql = { version = "8.2.0", path = "../sz-orm-graphql", optional = true }
sz-orm-logger = { version = "8.2.0", path = "../sz-orm-logger", optional = true }
sz-orm-postgis = { version = "8.2.0", path = "../sz-orm-postgis", optional = true }
sz-orm-timeseries = { version = "8.2.0", path = "../sz-orm-timeseries", optional = true }
sz-orm-search = { version = "8.2.0", path = "../sz-orm-search", optional = true }
sz-orm-rw = { version = "8.2.0", path = "../sz-orm-rw", optional = true }
sz-orm-config = { version = "8.2.0", path = "../sz-orm-config", optional = true }
# v6.8.0：CDC 变更捕获（cdc-mysql/cdc-postgres/cdc-sqlite feature）
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "chrono", "json"], optional = true }


[dev-dependencies]
tokio = { workspace = true, features = ["full", "test-util"] }


# M3-T3: 差分测试需要 sz-orm-query-builder
sz-orm-query-builder = { path = "../sz-orm-query-builder" }
# v4.3.0 M2：N+1 静态检测交叉验证（静态分析 ↔ 运行时 N1QueryDetector）
sz-orm-n1-lint = { path = "../sz-orm-n1-lint", features = ["n1-lint"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "chrono", "json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
# DuckDB 真实集成测试（bundled：编译 DuckDB 源码，需 MSVC + CMake）
duckdb = { version = "1", features = ["bundled"] }
oracle = { version = "0.6", default-features = false, features = ["chrono"] }
# v2.0.0 任务 1.2：SQL Server 真实集成测试（tiberius 0.12 异步驱动）
