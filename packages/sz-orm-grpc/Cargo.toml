[package]
name = "sz-orm-grpc"
version.workspace = true
edition.workspace = true
description = "SZ-ORM gRPC Extension - gRPC microservice client and server"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
build = "build.rs"

[features]
# v4.9.0：OWASP Top 10 完整覆盖渗透测试套件（编译门控，默认关闭）
owasp-pentest-suite = []
# Enable the real tokio + tonic based gRPC transport.
# Disabled by default so consumers only pay for the in-memory mock.
real = [
    "dep:tonic",
    "dep:tonic-prost",
    "dep:prost",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:tonic-prost-build",
    "dep:protoc-bin-vendored",
]


[package.metadata.cargo-machete]
ignored = ['prost', 'tonic-prost']
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
prost = { version = "0.14", optional = true }
tokio = { workspace = true, optional = true }
tokio-stream = { version = "0.1", optional = true }
# 锁毒化修复：使用 parking_lot 替代 std::sync，消除 .lock().unwrap() panic 风险
parking_lot.workspace = true

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[dev-dependencies]
tokio = { workspace = true }

[lints]
workspace = true

