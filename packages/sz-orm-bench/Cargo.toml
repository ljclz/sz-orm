[package]
name = "sz-orm-bench"
description = "Benchmark suite: sz-orm vs SeaORM vs Diesel vs SQLx with P50/P95/P99 latency, throughput, and memory metrics"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "sz-orm-bench"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# real-bench feature 下的真实 DB 查询依赖（optional，不影响默认编译）
sz-orm-core = { workspace = true, optional = true }
sz-orm-sqlx = { workspace = true, optional = true }
sz-orm-oracle = { path = "../sz-orm-oracle", version = "9.0.0", optional = true }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "chrono", "json"], optional = true }
tokio = { workspace = true, optional = true }
sea-orm = { version = "1.1", optional = true, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-mysql", "sqlx-postgres"] }
# v7.5.0 stability-matrix 依赖
sz-orm-fusion = { path = "../sz-orm-fusion", version = "9.0.0", optional = true }

[dev-dependencies]
tokio = { workspace = true }
sz-orm-observability = { path = "../sz-orm-observability", version = "9.0.0", features = ["perf-budget-alert"] }

[features]
default = []
# v7.5.0 稳定性压测矩阵（默认关闭，依赖 sz-orm-fusion/chaos）
stability-matrix = ["dep:sz-orm-fusion", "sz-orm-fusion/chaos"]
# 启用真实 DB 基准测试（sz-orm + sqlx + sea-orm + oracle）
real-bench = ["dep:sz-orm-core", "dep:sz-orm-sqlx", "dep:sz-orm-oracle", "dep:sqlx", "dep:tokio", "dep:sea-orm"]
# diesel 基准（diesel 不在本地缓存，暂不启用）
real-bench-diesel = ["real-bench"]

perf-bench-real = ["bench-real-db", "perf-regression-ci", "perf-budget-alert"]
bench-real-db = []
perf-regression-ci = ["bench-real-db"]
perf-budget-alert = []
[lints]
workspace = true
[[test]]
name = "stability_matrix_test"
required-features = ["stability-matrix"]
# v8.1.0 性能基准实测化端到端接线测试
[[test]]
name = "perf_bench_real_wiring"
required-features = ["perf-bench-real"]
