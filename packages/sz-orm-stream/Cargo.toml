[package]
name = "sz-orm-stream"
description = "Async streaming result set: cursor-based streaming with backpressure and keyset pagination"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.5.0 M3：异步流式结果集（游标分页 + keyset pagination + 背压控制）
stream-resultset = ["dep:tokio", "dep:futures", "sz-orm-core/async-row-stream"]
# v7.0.0：实时流处理（物化视图 + 流批一体 + 窗口 + Flink 集成）
stream-processing = ["stream-resultset", "dep:reqwest", "dep:parking_lot"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sz-orm-core = { path = "../sz-orm-core", version = "7.0.0" }
tokio = { version = "1.40", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }
# v7.0.0 stream-processing 依赖
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
parking_lot = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "regression_stream_real"
path = "benches/regression_stream_real.rs"
harness = false
required-features = ["stream-resultset"]

[[test]]
name = "v62_perf_stream"
path = "tests/v62_perf_stream.rs"
required-features = ["stream-resultset"]

[lints]
workspace = true