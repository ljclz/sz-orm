[package]
name = "sz-orm-parallel"
description = "Parallel query executor: concurrent query scheduling with result merging and failure degradation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.5.0 M1：并行查询执行器（并发度控制 + 四种合并策略 + 超时降级）
parallel-query = ["dep:tokio", "dep:futures"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sz-orm-core = { path = "../sz-orm-core", version = "4.5.0" }
sz-orm-adaptive = { path = "../sz-orm-adaptive", version = "4.5.0" }
tokio = { version = "1.40", features = ["full"], optional = true }
futures = { version = "0.3", optional = true }

[lints]
workspace = true