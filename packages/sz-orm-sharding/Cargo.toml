[package]
name = "sz-orm-sharding"
description = "Sharding: Hash/Range/Date/List/Composite with consistent hashing"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v4.0.0 M5：分片自动 rebalance（最小搬迁 + 双写 + 断点续传 + 进度可观测）
shard-rebalance = ["dep:tokio"]


[package.metadata.cargo-machete]
ignored = ['serde_json']
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# v4.0.0 M5：异步迁移执行（shard-rebalance feature）
tokio = { workspace = true, optional = true, features = ["sync", "rt", "time"] }

[dev-dependencies]
# v0.2.1 修复 T-1：Property-Based Testing
proptest = { workspace = true }

[[test]]
name = "property"
path = "tests/property.rs"

[lints]
workspace = true