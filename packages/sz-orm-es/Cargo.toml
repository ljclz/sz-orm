[package]
name = "sz-orm-es"
version.workspace = true
edition.workspace = true
description = "SZ-ORM Elasticsearch Extension - MOCK-ONLY (in-memory mock, NOT for production; real ES client integration via EsSync trait)"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# v3.5.0 M3-T1：真实 Elasticsearch 客户端集成（默认 Mock，启用后接入真实 ES）
# 基于 reqwest 直接调用 ES REST API（与 design.md §5.1.3 "elasticsearch crate 或 reqwest" 一致）
# 选择 reqwest 而非 elasticsearch crate 的原因：
# 1. 与现有 real_es_integration.rs 测试一致（已用 reqwest 0.12）
# 2. 避免 elasticsearch crate 8.5 与 workspace reqwest 0.12 的版本冲突
# 3. reqwest 直接调 REST API 更轻量，编译更快
real = ["dep:reqwest", "dep:tokio"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# v3.5.0 M3-T1：真实 ES HTTP 客户端（real feature，默认不启用）
reqwest = { version = "0.12", features = ["json"], optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
reqwest = { version = "0.12", features = ["json"] }

[lints]
workspace = true
