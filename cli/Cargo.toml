[package]
name = "sz-orm-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SZ-ORM 命令行工具 — 迁移管理、模型/迁移代码生成、SQL 执行"

[[bin]]
name = "sz-orm"
path = "src/main.rs"

[dependencies]
sz-orm-core = { version = "1.0.0", path = "../packages/sz-orm-core" }
sz-orm-sql-validator = { version = "1.0.0", path = "../packages/sz-orm-sql-validator" }
sz-orm-sqlx = { version = "1.0.0", path = "../packages/sz-orm-sqlx" }
tokio = { workspace = true, features = ["full"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "1.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "chrono", "json"] }

[features]
default = []

[lints]
workspace = true
