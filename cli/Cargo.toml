[package]
name = "sz-orm-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SZ-ORM 鍛戒护琛屽伐鍏?鈥?杩佺Щ绠＄悊銆佹ā鍨?杩佺Щ浠ｇ爜鐢熸垚銆丼QL 鎵ц"

[[bin]]
name = "sz-orm"
path = "src/main.rs"

[dependencies]
sz-orm-core = { version = "4.1.0", path = "../packages/sz-orm-core" }
sz-orm-sql-validator = { version = "4.1.0", path = "../packages/sz-orm-sql-validator" }
sz-orm-sqlx = { version = "4.1.0", path = "../packages/sz-orm-sqlx" }
sz-orm-designer = { version = "4.1.0", path = "../packages/sz-orm-designer", optional = true }
sz-orm-swagger = { version = "4.1.0", path = "../packages/sz-orm-swagger", optional = true }
sz-orm-n1-lint = { version = "4.1.0", path = "../packages/sz-orm-n1-lint", optional = true }
tokio = { workspace = true, features = ["full"] }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "chrono", "json"] }

[features]
default = []
data-seeding = ["sz-orm-core/data-seeding"]
schema-diff-viz = ["sz-orm-core/schema-diff-viz"]
designer = ["dep:sz-orm-designer", "sz-orm-designer/schema-designer"]
openapi-reverse = ["dep:sz-orm-swagger", "sz-orm-swagger/openapi-reverse"]
# v4.3.0 M2：N+1 静态检测（sz-orm n1-lint --path=...）
n1-lint = ["dep:sz-orm-n1-lint", "sz-orm-n1-lint/n1-lint"]

[lints]
workspace = true
