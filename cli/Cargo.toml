[package]
name = "sz-orm-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SZ-ORM 命令行工具 — 迁移管理、模型迁移代码生成、SQL 执行"

[[bin]]
name = "sz-orm"
path = "src/main.rs"

[lib]
name = "sz_orm_cli"
path = "src/lib.rs"

[dependencies]
sz-orm-core = { version = "9.0.0", path = "../packages/sz-orm-core", features = [
    "dist-cache", "l1-cache", "connection-level-tenant",
    "forward-compat-sandbox", "zero-downtime-rollback",
    "tenant-quota-rls-enhanced", "multi-tenant-enhanced",
] }
sz-orm-sql-validator = { version = "9.0.0", path = "../packages/sz-orm-sql-validator" }
sz-orm-sqlx = { version = "9.0.0", path = "../packages/sz-orm-sqlx" }
sz-orm-designer = { version = "9.0.0", path = "../packages/sz-orm-designer", optional = true }
sz-orm-swagger = { version = "9.0.0", path = "../packages/sz-orm-swagger", optional = true }
sz-orm-n1-lint = { version = "9.0.0", path = "../packages/sz-orm-n1-lint", optional = true }
sz-orm-observability = { version = "9.0.0", path = "../packages/sz-orm-observability", features = ["anomaly-detection", "anomaly-remediation-rca"] }
sz-orm-storage = { version = "9.0.0", path = "../packages/sz-orm-storage", features = ["cost-analysis", "multicloud-cost-forecast"] }
sz-orm-batch = { version = "9.0.0", path = "../packages/sz-orm-batch", features = ["batch-v2", "batch-atomic", "copy-parallel-shard"] }
sz-orm-queue = { version = "9.0.0", path = "../packages/sz-orm-queue", features = ["dlx-auto-redelivery", "delayed-priority-queue"] }
sz-orm-dtx = { version = "9.0.0", path = "../packages/sz-orm-dtx", optional = true }
sz-orm-advisor = { version = "9.0.0", path = "../packages/sz-orm-advisor", optional = true }
sz-orm-stream = { version = "9.0.0", path = "../packages/sz-orm-stream", optional = true }
sz-orm-parallel = { version = "9.0.0", path = "../packages/sz-orm-parallel", optional = true }
sz-orm-flamegraph = { version = "9.0.0", path = "../packages/sz-orm-flamegraph", optional = true }
sz-orm-ai = { version = "9.0.0", path = "../packages/sz-orm-ai", optional = true }
sz-orm-vector = { version = "9.0.0", path = "../packages/sz-orm-vector", optional = true }
sz-orm-back = { version = "9.0.0", path = "../packages/sz-orm-back", optional = true }
sz-orm-mig = { version = "9.0.0", path = "../packages/sz-orm-mig", optional = true }
sz-orm-wasm = { version = "9.0.0", path = "../packages/sz-orm-wasm", optional = true }
sz-orm-config = { version = "9.0.0", path = "../packages/sz-orm-config", optional = true }
sz-orm-lsp = { version = "9.0.0", path = "../packages/sz-orm-lsp", optional = true }
tokio = { workspace = true, features = ["full"] }
async-trait = "0.1"
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql", "postgres", "sqlite", "chrono", "json"] }

[features]
default = []
data-seeding = ["sz-orm-core/data-seeding"]
schema-diff-viz = ["sz-orm-core/schema-diff-viz"]
designer = ["dep:sz-orm-designer", "sz-orm-designer/schema-designer"]
openapi-reverse = ["dep:sz-orm-swagger", "sz-orm-swagger/openapi-reverse"]
# v4.3.0 M2：N+1 静态检测（sz-orm n1-lint --path=...）
n1-lint = ["dep:sz-orm-n1-lint", "sz-orm-n1-lint/n1-lint"]
# P3 幻影修复：feature 启用点（E 模式）
query-logging = ["sz-orm-observability/query-logging"]
cross-lang-dtx = ["dep:sz-orm-dtx", "sz-orm-dtx/cross-lang-dtx"]
oracle = ["sz-orm-sqlx/oracle"]
mssql = ["sz-orm-sqlx/mssql"]
# P0 幻影修复：核心包接入 cli（B 模式）
query-advisor = ["dep:sz-orm-advisor", "sz-orm-advisor/query-advisor"]
stream-resultset = ["dep:sz-orm-stream", "sz-orm-stream/stream-resultset"]
parallel-query = ["dep:sz-orm-parallel"]
# P2 幻影修复：依赖链包接入 cli（B 模式）
flamegraph = ["dep:sz-orm-flamegraph"]
ai-capability = ["dep:sz-orm-ai"]
vector-search = ["dep:sz-orm-vector"]
# P1 幻影修复：整包接入 cli（B 模式）
backup = ["dep:sz-orm-back"]
migrate = ["dep:sz-orm-mig"]
wasm-build = ["dep:sz-orm-wasm"]
hot-reload = ["dep:sz-orm-config"]
lsp-server = ["dep:sz-orm-lsp"]

[lints]
workspace = true

[[test]]
name = "cli_entity_gen_test"
path = "tests/cli_entity_gen_test.rs"

[[test]]
name = "cli_doc_gen_test"
path = "tests/cli_doc_gen_test.rs"
[[test]]
name = "cli_entity_gen_ext_test"
path = "tests/cli_entity_gen_ext_test.rs"

# feature 门控依赖：cargo-machete 静态扫描不可见其 feature 引用（2026-09-26 审计 G23 登记豁免）
[package.metadata.cargo-machete]
ignored = ["sz-orm-dtx", "sz-orm-vector"]
